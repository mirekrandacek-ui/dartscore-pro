name: iOS input focus fix - TestFlight build 8

on:
  push:
    branches:
      - test/ios-input-focus-20261018
    paths:
      - .github/workflows/ios-input-focus-build8.yml

permissions:
  contents: read

concurrency:
  group: ios-testflight-build8
  cancel-in-progress: false

jobs:
  signed-archive:
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frozen web bundle
        run: npm run build

      - name: Verify build 8 regression tests and assignment script
        run: |
          npm test
          ruby -c scripts/asc_assign_internal_build8.rb

      - name: Verify input focus and score layout before signing
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install webkit chromium
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/dartscore-build8-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node qa/input-focus-viewport.mjs
          node qa/x01-score-clipping.mjs

      - name: Retain build 8 UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_build8_UI_evidence
          path: |
            build/input-focus-evidence/
            build/x01-score-evidence/
          if-no-files-found: ignore

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_PRIVATE_KEY"
          KEY_DIR="$RUNNER_TEMP/appstore-key"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify release identity
        run: |
          grep -q "DEVELOPMENT_TEAM = MQG667M2B8;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.randis2288.dartscorepro;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = 1.1.63;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = 8;" ios/App/App.xcodeproj/project.pbxproj

      - name: Create unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Normalize embedded framework signatures
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DartScorePro.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH/Frameworks"
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            echo "Ad-hoc signing $(basename "$framework") before cloud export"
            codesign --remove-signature "$framework" 2>/dev/null || true
            codesign --force --sign - --timestamp=none "$framework"
          done
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>MQG667M2B8</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$APPSTORE_KEY_PATH"             -authenticationKeyID "$APPSTORE_KEY_ID"             -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/App.ipa"
          mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/export/DartScorePro_1.1.63_build8.ipa"

      - name: Validate IPA with App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            -f "$RUNNER_TEMP/export/DartScorePro_1.1.63_build8.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Upload build to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            -f "$RUNNER_TEMP/export/DartScorePro_1.1.63_build8.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_iOS_1.1.63_build8
          path: ${{ runner.temp }}/export/DartScorePro_1.1.63_build8.ipa
          if-no-files-found: error

      - name: Assign build 8 to internal TestFlight testers
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/asc_assign_internal_build8.rb
