name: iOS build 12 - signed IPA and internal TestFlight only

on:
  push:
    branches:
      - fix/ios-v164-att-review-build12-20261104
    paths:
      - .github/workflows/ios-build12-internal-testflight.yml

permissions:
  contents: read

concurrency:
  group: ios-build12-internal-testflight
  cancel-in-progress: false

jobs:
  signed-archive:
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frozen web bundle
        run: npm run build

      - name: Verify release regression tests
        run: |
          npm test

      - name: Verify 501, Cricket and Around keypads in mobile WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install webkit chromium
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/dartscore-build12-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node qa/ios-keypad-labels.mjs

      - name: Retain visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_build12_UI_evidence
          path: |
            build/ios-keypad-evidence/
          if-no-files-found: ignore

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_PRIVATE_KEY"
          KEY_DIR="$RUNNER_TEMP/appstore-key"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify release identity and untouched app source
        run: |
          # actions/checkout is shallow; deepen to load the verified build-12 commit.
          git fetch --no-tags --deepen=5 origin "$GITHUB_REF_NAME"
          git diff --exit-code 4750558acb6eee4d08eb0541f827db6a8c3db122 HEAD -- ios src
          ruby -c scripts/asc_assign_internal_build12.rb
          grep -q "DEVELOPMENT_TEAM = MQG667M2B8;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.randis2288.dartscorepro;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = 1.1.64;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = 12;" ios/App/App.xcodeproj/project.pbxproj

      - name: Create unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Normalize embedded framework signatures
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DartScorePro.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH/Frameworks"
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            echo "Ad-hoc signing $(basename "$framework") before cloud export"
            codesign --remove-signature "$framework" 2>/dev/null || true
            codesign --force --sign - --timestamp=none "$framework"
          done
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>MQG667M2B8</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$APPSTORE_KEY_PATH"             -authenticationKeyID "$APPSTORE_KEY_ID"             -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/App.ipa"
          mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/export/DartScorePro_1.1.64_build12.ipa"

      - name: Verify signed IPA identity and Meta SDK
        run: |
          python3 - <<'PY'
          import os, plistlib, zipfile
          path = os.path.join(os.environ['RUNNER_TEMP'], 'export', 'DartScorePro_1.1.64_build12.ipa')
          with zipfile.ZipFile(path) as ipa:
              info = plistlib.loads(ipa.read('Payload/App.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.randis2288.dartscorepro'
              assert info['CFBundleShortVersionString'] == '1.1.64'
              assert str(info['CFBundleVersion']) == '12'
              assert info['FacebookAppID'] == '1714207943552602'
              assert info['FacebookAutoLogAppEventsEnabled'] is False
              assert info['FacebookAdvertiserIDCollectionEnabled'] is False
              assert info['FacebookSKAdNetworkReportEnabled'] is False
              sdk = plistlib.loads(ipa.read('Payload/App.app/Frameworks/FBSDKCoreKit.framework/Info.plist'))
              assert sdk['CFBundleVersion'] == '18.1.1'
          print('Signed IPA: DartScore Pro 1.1.64 (12), Meta SDK 18.1.1, defaults disabled')
          PY

      - name: Validate build 12 IPA with App Store Connect (read-only validation, no upload)
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            -f "$RUNNER_TEMP/export/DartScorePro_1.1.64_build12.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Publish signed IPA artifact for transfer to Randy
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_iOS_1.1.64_build12
          path: ${{ runner.temp }}/export/DartScorePro_1.1.64_build12.ipa
          if-no-files-found: error

      - name: Upload build 12 to App Store Connect for internal TestFlight only
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/DartScorePro_1.1.64_build12.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Verify build 12 in existing INTERNAL TestFlight group (no App Review)
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/asc_assign_internal_build12.rb
