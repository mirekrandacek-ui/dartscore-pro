name: Inspect App Store version

on:
  push:
    branches:
      - feature/ios-v97
    paths:
      - .github/workflows/ios-inspect-version.yml

jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: Inspect version build and IAP
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --quiet PyJWT cryptography requests
          python - <<'PY'
          import os,time,jwt,requests
          key=os.environ["APPSTORE_PRIVATE_KEY"]
          kid=os.environ["APPSTORE_KEY_ID"]
          issuer=os.environ["APPSTORE_ISSUER_ID"]
          now=int(time.time())
          token=jwt.encode({"iss":issuer,"iat":now,"exp":now+600,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          headers={"Authorization":"Bearer "+token}
          base="https://api.appstoreconnect.apple.com"
          app_id="6817341039"

          def get(path,params=None):
              r=requests.get(base+path,headers=headers,params=params)
              print("HTTP",r.status_code,path)
              r.raise_for_status()
              return r.json()

          versions=get(f"/v1/apps/{app_id}/appStoreVersions",{"limit":50})["data"]
          for v in versions:
              a=v["attributes"]
              print("VERSION",v["id"],a.get("versionString"),a.get("platform"),a.get("appStoreState"))

          builds=get(f"/v1/apps/{app_id}/builds",{"limit":50})["data"]
          for b in builds:
              a=b["attributes"]
              print("BUILD",b["id"],a.get("version"),a.get("processingState"),a.get("expired"))

          iaps=get(f"/v1/apps/{app_id}/inAppPurchasesV2",{"limit":50})["data"]
          for i in iaps:
              a=i["attributes"]
              print("IAP",i["id"],a.get("productId"),a.get("state"))
          PY

