name: Patch native share web
on:
  push:
    branches: [fix/native-share-bridge-web]
    paths:
      - '.github/workflows/patch-native-share-web.yml'
      - '.github/scripts/patch_native_share_web.py'
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python .github/scripts/patch_native_share_web.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text(encoding='utf-8')
          assert 'window.DartScoreAndroid?.shareApp' in s
          assert 'window.DartScoreAndroid.shareApp(payload.title, payload.text, payload.url);' in s
          print('share web verification OK')
          PY
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Use native Android share chooser"
          git rm -f .github/scripts/patch_native_share_web.py .github/workflows/patch-native-share-web.yml
          git commit -m "Remove temporary native share helpers"
          git restore dist || true
          git push origin HEAD:fix/native-share-bridge-web
