name: Build v75 native share
on:
  push:
    branches: [release/v75-native-share-production]
    paths:
      - '.github/workflows/build-v75-native-share.yml'
      - '.github/scripts/patch_v75_share.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_v75_share.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release AAB
        run: ./gradlew bundleRelease
      - name: Verify v75
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle').read_text(encoding='utf-8')
          j=Path('app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java').read_text(encoding='utf-8')
          assert 'versionCode 75' in g
          assert 'versionName "1.1.41"' in g
          assert 'FORCE_FREE_BANNER_TEST = false' in j
          assert 'public void shareApp(String title, String text, String url)' in j
          assert 'Intent.ACTION_SEND' in j
          assert 'Intent.createChooser(sendIntent, null)' in j
          print('v75 verification OK')
          PY
      - name: Prepare AAB
        run: |
          mkdir -p aab-out
          cp app/build/outputs/bundle/release/app-release.aab aab-out/DartScore-Pro-v75.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dartscore-pro-v75-aab
          path: aab-out/DartScore-Pro-v75.aab
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          git commit -m "Add native app sharing in v75"
          git rm -f .github/scripts/patch_v75_share.py .github/workflows/build-v75-native-share.yml
          git commit -m "Remove temporary v75 build helpers"
          git push origin HEAD:release/v75-native-share-production
