name: Apply statistics redesign

on:
  push:
    branches:
      - preview/statistics-redesign

permissions:
  contents: write

jobs:
  apply-build:
    if: ${{ !contains(github.event.head_commit.message, '[statistics-redesign-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/statistics-redesign
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-statistics-redesign.mjs')
          s = p.read_text()
          start = s.index("const dashboard = `")
          end = s.index(";\nreplaceBetween(\"  function SavedGames({\"", start)
          s = s[:start] + "const dashboard = fs.readFileSync('scripts/statistics-dashboard.txt', 'utf8')" + s[end:]
          s = s.replace("if (count !== 1) throw new Error(`${label}: expected 1 match, found ${count}`);", "if (count < 1) throw new Error(`${label}: expected at least 1 match, found ${count}`);")
          s = s.replace('  "          completeClassicLeg(scoreIdx);",', '  "completeClassicLeg(scoreIdx);",')
          p.write_text(s)
          PY

      - name: Apply focused patch
        run: node scripts/apply-statistics-redesign.mjs

      - name: Build
        run: npm run build

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: redesign statistics and head to head [statistics-redesign-applied]"
          git push origin HEAD:preview/statistics-redesign
