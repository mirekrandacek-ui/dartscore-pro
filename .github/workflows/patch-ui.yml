name: Patch web UI

on:
  push:
    branches:
      - ui/banner-dropdown-roulette-premium

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/banner-dropdown-roulette-premium
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_ui.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/App.jsx').read_text(encoding='utf-8')
          c = Path('src/app.css').read_text(encoding='utf-8')
          assert '<select' not in s and '</select>' not in s
          assert s.count('<ThemedSelect') == 9
          assert 'rouletteDrawBtn' in s and 'rouletteHitBtn' in s and 'rouletteSwitchBtn' in s
          assert "marginBottom: '12px'" in s
          assert '.themedSelectMenu' in c
          assert '#3b82f6' in c and '#22c55e' in c and '#fde047' in c
          PY
      - name: Commit result
        shell: bash
        run: |
          rm scripts/patch_ui.py .github/workflows/patch-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/app.css scripts/patch_ui.py .github/workflows/patch-ui.yml
          git commit -m "Restyle dropdowns and roulette controls"
          git push origin HEAD:ui/banner-dropdown-roulette-premium
