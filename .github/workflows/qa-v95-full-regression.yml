name: QA v96 candidate full regression + AAB
# rerun-v96-2

on:
  push:
    branches:
      - qa/v95-audit-20261008
    paths:
      - .github/workflows/qa-v95-full-regression.yml

jobs:
  validate-v96:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout v96 candidate
        uses: actions/checkout@v4
        with:
          ref: release/v96-qa-fixes
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build frozen web bundle
        run: npm run build

      - name: Start local v96 web
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run v96 full regression
        run: node qa/v96-full-regression.mjs http://127.0.0.1:4173/

      - name: Verify release identity and frozen web
        run: |
          grep -q "versionCode 96" app/build.gradle
          grep -q 'versionName "1.1.62"' app/build.gradle
          grep -q "const APP_VERSION = '1.1.62'" src/App.jsx
          grep -q "new OfflineWebViewClient(" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "bundleOfflineWebApp" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed v96 AAB
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify bundled web + signature
        run: |
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'base/assets/offline/index.html'
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'base/assets/offline/assets/'
          if unzip -l app/build/outputs/bundle/release/app-release.aab | grep -E 'base/lib/.+\.so$'; then
            echo "Unexpected native library remains in AAB"
            exit 1
          fi
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v96_QA_report
          path: qa-results/
          if-no-files-found: warn

      - name: Upload v96 AAB
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v96_1.1.62
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
