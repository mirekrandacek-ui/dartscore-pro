name: QA v95 full regression

on:
  pull_request:
    branches:
      - release/v95-meta-adapter
  push:
    branches:
      - qa/v95-audit-20261008
    paths:
      - qa/**
      - .github/workflows/qa-v95-full-regression.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Compile web app
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run full-flow audit
        run: node qa/full-flow-audit.mjs https://dartscore-pro.vercel.app/

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro-v95-full-flow-audit
          path: qa-results/
          if-no-files-found: warn
