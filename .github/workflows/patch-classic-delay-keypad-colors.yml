name: Patch classic delay and keypad colors
on:
  push:
    branches: [ui/classic-delay-keypad-colors]
    paths:
      - '.github/workflows/patch-classic-delay-keypad-colors.yml'
      - '.github/scripts/patch_classic_delay_keypad_colors.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python .github/scripts/patch_classic_delay_keypad_colors.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx').read_text(encoding='utf-8')
          css = Path('src/app.css').read_text(encoding='utf-8')
          start = app.index('  const commitClassic = (value, mOverride) => {')
          end = app.index('  const commitClassicRound = (roundScore) => {', start)
          classic = app[start:end]
          assert 'if (darts.length >= 3) return;' in classic
          assert 'advanceTurn(500);' in classic
          assert 'return nd;' in classic
          assert 'linear-gradient(180deg,#fde047,#eab308)' in css
          assert 'linear-gradient(180deg,#3b82f6,#1d4ed8)' in css
          assert '.padPane.dartKeypad .multBtn.backspace' in css
          print('verification OK')
          PY
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/app.css
          git commit -m "Show third Classic dart briefly and color keypad actions"
          git rm .github/scripts/patch_classic_delay_keypad_colors.py .github/workflows/patch-classic-delay-keypad-colors.yml
          git commit -m "Remove temporary keypad patch helpers"
          git push origin ui/classic-delay-keypad-colors
