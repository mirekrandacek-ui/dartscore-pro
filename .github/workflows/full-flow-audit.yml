name: DartScore full-flow audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'audit/**'
      - '.github/workflows/full-flow-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run full-flow audit
        run: node audit/full-flow.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dartscore-full-flow-audit
          path: audit-output/
          if-no-files-found: warn
