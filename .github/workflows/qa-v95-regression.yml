name: QA v95 full regression

on:
  pull_request:
    branches:
      - release/v95-meta-adapter

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node qa/ui-discovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-v95-discovery
          path: qa-discovery.png
          if-no-files-found: ignore
