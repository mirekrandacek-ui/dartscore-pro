name: QA v95 full regression

on:
  pull_request:
    branches:
      - release/v95-meta-adapter

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node qa/full-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-v95-full-report
          path: |
            qa-v95-report.json
            qa-v95-report.md
          if-no-files-found: error
