name: iOS prebuilt simulator restart smoke test with boot timeout

on:
  push:
    branches:
      - test/ios-ump-coldstart-simulator-20261103
    paths:
      - .github/workflows/ios-prebuilt-restart-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restart:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download previously compiled iOS UMP fix
        uses: actions/download-artifact@v4
        with:
          name: DartScorePro-iOS-ConsentNoRepeat-Appetize
          run-id: 41464093063
          github-token: ${{ github.token }}
          path: prebuilt

      - name: Unpack and run native iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence unpack
          ls -lah prebuilt
          unzip -q 'prebuilt/DartScorePro_iOS_ConsentNoRepeat_Appetize.zip' -d unpack
          test -f unpack/App.app/App
          xcrun simctl list devices available | tee evidence/devices.txt
          python3 - <<'PY'
          import subprocess,json
          items=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          valid=[d for rt,ds in items.items() if 'iOS' in rt for d in ds if d.get('isAvailable',True) and 'iPhone' in d.get('name','')]
          if not valid: raise SystemExit('NO_IPHONE_SIMULATOR_AVAILABLE')
          valid.sort(key=lambda d:(d.get('state')!='Booted',d.get('name','')))
          d=valid[0]
          print('Selected',d)
          open('evidence/udid.txt','w').write(d['udid'])
          PY
          UDID="$(cat evidence/udid.txt)"
          if ! xcrun simctl boot "$UDID" 2>evidence/boot-stderr.txt; then
            cat evidence/boot-stderr.txt
          fi
          python3 - "$UDID" <<'PY'
          import sys,subprocess
          try: subprocess.run(['xcrun','simctl','bootstatus',sys.argv[1],'-b'],timeout=200,check=True)
          except subprocess.TimeoutExpired: raise SystemExit('SIMULATOR_BOOT_TIMED_OUT')
          PY
          xcrun simctl install "$UDID" unpack/App.app
          APP=com.randis2288.dartscorepro
          xcrun simctl launch "$UDID" "$APP" | tee evidence/first-launch.txt
          sleep 7
          xcrun simctl io "$UDID" screenshot evidence/first.png
          DATA="$(xcrun simctl get_app_container "$UDID" "$APP" data)"
          mkdir -p "$DATA/Documents"
          echo 'preserved across process restart' > "$DATA/Documents/ci-restart-proof.txt"
          xcrun simctl terminate "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$APP" | tee evidence/second-launch.txt
          sleep 7
          xcrun simctl io "$UDID" screenshot evidence/second.png
          DATA="$(xcrun simctl get_app_container "$UDID" "$APP" data)"
          test "$(cat "$DATA/Documents/ci-restart-proof.txt")" = 'preserved across process restart'
          echo 'PASS: fresh process preserves app sandbox state' | tee evidence/result.txt
          xcrun simctl terminate "$UDID" "$APP"
          xcrun simctl uninstall "$UDID" "$APP"
          xcrun simctl install "$UDID" unpack/App.app
          DATA="$(xcrun simctl get_app_container "$UDID" "$APP" data)"
          test ! -f "$DATA/Documents/ci-restart-proof.txt"
          echo 'PASS: reinstall clears sandbox state' | tee -a evidence/result.txt
          echo 'NOT PROVEN: accept/reject UMP choice persists; this test does not interact with the consent form' | tee -a evidence/result.txt
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro-iOS-prebuilt-coldstart-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
