name: iOS 2.08 build 12 - signed internal TestFlight

on:
  push:
    branches:
      - test/ios-208-build-only-20261108
    paths:
      - .github/workflows/ios-208-internal-testflight.yml

permissions:
  contents: read

concurrency:
  group: ios-208-internal-build12
  cancel-in-progress: false

jobs:
  signed-archive:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_PRIVATE_KEY"
          KEY_DIR="$RUNNER_TEMP/appstore-key"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Read-only Apple identity and duplicate preflight
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          ruby -c scripts/asc_internal_208.rb
          ruby scripts/asc_internal_208.rb preflight | tee build/evidence/preflight.log

      - name: Install dependencies
        run: npm ci

      - name: Build frozen web bundle
        run: npm run build

      - name: Verify build 12 regression tests and assignment script
        run: |
          npm test
          ruby -c scripts/asc_internal_208.rb

      - name: Sync Capacitor iOS
        run: |
          npx --no-install cap sync ios
          node scripts/verify-ios-bundle.mjs

      - name: Verify release identity
        run: |
          grep -q "DEVELOPMENT_TEAM = MQG667M2B8;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.randis2288.dartscorepro;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = 2.08;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = 12;" ios/App/App.xcodeproj/project.pbxproj

      - name: Create unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Normalize embedded framework signatures
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DartScorePro.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH/Frameworks"
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            echo "Ad-hoc signing $(basename "$framework") before cloud export"
            codesign --remove-signature "$framework" 2>/dev/null || true
            codesign --force --sign - --timestamp=none "$framework"
          done
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>MQG667M2B8</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$APPSTORE_KEY_PATH"             -authenticationKeyID "$APPSTORE_KEY_ID"             -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/App.ipa"
          mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/export/DartScorePro_2.08_build12.ipa"

      - name: Verify signed IPA identity and Meta SDK
        run: |
          python3 - <<'PY'
          import os, plistlib, zipfile, pathlib, hashlib
          path = os.path.join(os.environ['RUNNER_TEMP'], 'export', 'DartScorePro_2.08_build12.ipa')
          with zipfile.ZipFile(path) as ipa:
              info = plistlib.loads(ipa.read('Payload/App.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.randis2288.dartscorepro'
              assert info['CFBundleShortVersionString'] == '2.08'
              assert str(info['CFBundleVersion']) == '12'
              assert info['FacebookAppID'] == '1714207943552602'
              assert info['FacebookAutoLogAppEventsEnabled'] is False
              assert info['FacebookAdvertiserIDCollectionEnabled'] is False
              assert info['FacebookSKAdNetworkReportEnabled'] is False
              for file in pathlib.Path('dist').rglob('*'):
                  if file.is_file():
                      bundled = ipa.read('Payload/App.app/public/' + file.relative_to('dist').as_posix())
                      assert hashlib.sha256(bundled).digest() == hashlib.sha256(file.read_bytes()).digest(), str(file)
              print('All signed IPA web files match the verified current UI bundle')
              sdk = plistlib.loads(ipa.read('Payload/App.app/Frameworks/FBSDKCoreKit.framework/Info.plist'))
              assert sdk['CFBundleVersion'] == '18.1.1'
          print('Signed IPA: DartScore Pro 2.08 (12), Meta SDK 18.1.1, defaults disabled')
          PY

      - name: Validate IPA with App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            -f "$RUNNER_TEMP/export/DartScorePro_2.08_build12.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_iOS_2.08_build12
          path: ${{ runner.temp }}/export/DartScorePro_2.08_build12.ipa
          if-no-files-found: error

      - name: Upload build 12 to internal TestFlight
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/DartScorePro_2.08_build12.ipa" -t ios --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Verify build 12 is available to the existing internal TestFlight group
        run: ruby scripts/asc_internal_208.rb assign

      - name: Retain processing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro-2.08-build12-TestFlight-evidence
          path: build/evidence/
          if-no-files-found: warn

      - name: Remove temporary Apple key
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPSTORE_KEY_PATH:-}" ]]; then rm -f "$APPSTORE_KEY_PATH"; fi
