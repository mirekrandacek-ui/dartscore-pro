name: Inspect game headers
on:
  push:
    branches:
      - ui/compact-game-header
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect game header/action blocks
        run: |
          echo '=== restart usages ==='
          grep -n -B 18 -A 28 "t(lang, 'restart')" src/App.jsx || true
          echo '=== save usages ==='
          grep -n -B 18 -A 28 "t(lang, 'saveGame')" src/App.jsx || true
          echo '=== back buttons ==='
          grep -n -B 18 -A 28 "t(lang, 'back')\|>Zpět<\|backTo" src/App.jsx || true
          echo '=== roulette headings ==='
          grep -n -B 20 -A 35 "rouletteTarget\|rouletteDouble\|rouletteTitle\|targetLabel" src/App.jsx || true
          echo '=== game labels ==='
          grep -n -B 14 -A 24 "classicGame\|x01\|cricket\|aroundClock\|aroundTheClock\|gameTitle" src/App.jsx || true
