name: Patch compact game header
on:
  push:
    branches:
      - ui/compact-game-header
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-game-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_compact_game_header.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/App.jsx').read_text(encoding='utf-8')
          c = Path('src/app.css').read_text(encoding='utf-8')
          assert 'compactGameTopBar' in s
          assert s.count('className="gameTextAction"') == 3
          assert "mode === 'classic'" in s and 'classicOutShortLabel' in s
          assert "mode === 'roulette' || mode === 'rouletteDouble'" in s
          assert 'screen === \'lobby\' && (' in s
          assert '/* === COMPACT GAME HEADER === */' in c
          assert '.gameTextAction' in c
          PY
      - name: Commit result and clean helpers
        shell: bash
        run: |
          rm -f scripts/patch_compact_game_header.py .github/workflows/patch-compact-game-header.yml .github/workflows/inspect-game-headers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/app.css scripts/patch_compact_game_header.py .github/workflows/patch-compact-game-header.yml .github/workflows/inspect-game-headers.yml
          git commit -m "Compact game header across all modes"
          git push origin HEAD:ui/compact-game-header
