name: Verify DartScore build 6 internal TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-testflight-layout-voice-20261018
    paths:
      - .github/workflows/ios-verify-internal-build6.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Apple API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_PRIVATE_KEY"
          KEY_DIR="$RUNNER_TEMP/appstore-key"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Verify existing uploaded build 6 is available to internal group
        shell: bash
        run: |
          set -euo pipefail
          ruby -c scripts/asc_assign_internal_build6.rb
          ruby scripts/asc_assign_internal_build6.rb
