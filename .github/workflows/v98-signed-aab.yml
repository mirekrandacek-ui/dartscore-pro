name: v98 Signed Android AAB (internal test)

on:
  push:
    branches:
      - feature/v98-x01-interstitial-5m
    paths:
      - 'src/**'
      - 'app/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/v98-signed-aab.yml'

permissions:
  contents: read

jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v98
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Test interstitial policy
        run: npm test
      - name: Build frozen web bundle
        run: npm run build
      - name: Check internal-test identity
        run: |
          grep -q 'versionCode 98' app/build.gradle
          grep -q 'versionName "1.1.64"' app/build.gradle
          grep -q "const APP_VERSION = '1.1.64'" src/App.jsx
          grep -q 'bundleOfflineWebApp' app/build.gradle
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed Android App Bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace --no-daemon
      - name: Verify offline UI and signature
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'base/assets/offline/index.html'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Stage named AAB
        run: cp app/build/outputs/bundle/release/app-release.aab DartScorePro_v98_1.1.64.aab
      - name: Upload signed v98 AAB for internal test
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v98_1.1.64_AAB
          path: DartScorePro_v98_1.1.64.aab
          if-no-files-found: error
          retention-days: 14
