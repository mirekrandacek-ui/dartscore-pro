name: v98 interstitial checks

on:
  push:
    branches:
      - feature/v98-x01-interstitial-5m
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon
