name: iOS actual simulator cold-start and persisted app data

on:
  push:
    branches:
      - test/ios-ump-coldstart-simulator-20261103
    paths:
      - .github/workflows/ios-ump-coldstart-simulator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-native-relaunch:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - name: Checkout consent-fix candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate source and build native iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ump-coldstart-build" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/ump-coldstart-build/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/App"
          test -f "$APP/public/index.html"

      - name: Run real iOS simulator install, cold-launch, kill, relaunch and reinstall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios-ump-coldstart
          OUTPUT="$PWD/build/ios-ump-coldstart"
          export OUTPUT
          xcodebuild -version | tee "$OUTPUT/xcode.txt"
          xcrun simctl list devices available | tee "$OUTPUT/devices.txt"
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[(runtime,device) for runtime,items in devices.items() if 'iOS' in runtime for device in items if 'iPhone' in device.get('name','') and device.get('isAvailable',True)]
          if not candidates: raise SystemExit('No available iOS iPhone Simulator; cannot assert runtime consent behavior')
          runtime,device=sorted(candidates,key=lambda x:x[0],reverse=True)[0]
          with open(os.path.join(os.environ['OUTPUT'],'device.json'),'w') as f:json.dump(dict(runtime=runtime,device=device),f,indent=2)
          with open(os.path.join(os.environ['OUTPUT'],'udid.txt'),'w') as f:f.write(device['udid'])
          print('Using',device['name'],device['udid'],'runtime',runtime)
          PY
          UDID="$(cat "$OUTPUT/udid.txt")"
          if ! xcrun simctl boot "$UDID" 2>"$OUTPUT/boot-error.txt"; then
            grep -qi 'current state: Booted' "$OUTPUT/boot-error.txt" || (cat "$OUTPUT/boot-error.txt" && exit 1)
          fi
          xcrun simctl bootstatus "$UDID" -b
          APP="$RUNNER_TEMP/ump-coldstart-build/Build/Products/Debug-iphonesimulator/App.app"
          BUNDLE="com.randis2288.dartscorepro"
          xcrun simctl install "$UDID" "$APP"
          test -n "$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)"
          FIRST="$(xcrun simctl launch "$UDID" "$BUNDLE")"
          echo "FIRST: $FIRST"
          sleep 14
          xcrun simctl io "$UDID" screenshot "$OUTPUT/first-install.png"
          DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)"
          mkdir -p "$DATA/Documents"
          printf 'preserve-app-data-on-relaunch\n' > "$DATA/Documents/ci-persistence-marker.txt"
          cp "$DATA/Documents/ci-persistence-marker.txt" "$OUTPUT/marker-before.txt"
          python3 - "$DATA" "$OUTPUT/consent-keys-first.json" <<'PY'
          import sys,os,plistlib,json
          data,dest=sys.argv[1:]
          p=os.path.join(data,'Library','Preferences','com.randis2288.dartscorepro.plist')
          value=plistlib.load(open(p,'rb')) if os.path.exists(p) else {}
          # Do not publish personal consent strings: report names of present consent keys only.
          keys=sorted(k for k in value if k.startswith('IABTCF_') or 'Consent' in k or k.startswith('UMP'))
          json.dump(dict(app_prefs_exists=os.path.exists(p),consent_key_names=keys),open(dest,'w'),indent=2)
          PY
          xcrun simctl terminate "$UDID" "$BUNDLE"
          SECOND="$(xcrun simctl launch "$UDID" "$BUNDLE")"
          echo "SECOND: $SECOND"
          test "$FIRST" != "$SECOND"
          sleep 14
          xcrun simctl io "$UDID" screenshot "$OUTPUT/cold-relaunch.png"
          DATA_AFTER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)"
          test -f "$DATA_AFTER/Documents/ci-persistence-marker.txt"
          diff -u "$OUTPUT/marker-before.txt" "$DATA_AFTER/Documents/ci-persistence-marker.txt"
          python3 - "$DATA_AFTER" "$OUTPUT/consent-keys-relaunch.json" <<'PY'
          import sys,os,plistlib,json
          data,dest=sys.argv[1:]
          p=os.path.join(data,'Library','Preferences','com.randis2288.dartscorepro.plist')
          value=plistlib.load(open(p,'rb')) if os.path.exists(p) else {}
          keys=sorted(k for k in value if k.startswith('IABTCF_') or 'Consent' in k or k.startswith('UMP'))
          json.dump(dict(app_prefs_exists=os.path.exists(p),consent_key_names=keys),open(dest,'w'),indent=2)
          PY
          echo 'PASS: app terminated and restarted as a new process, with sandbox data intact'
          xcrun simctl terminate "$UDID" "$BUNDLE"
          xcrun simctl uninstall "$UDID" "$BUNDLE"
          xcrun simctl install "$UDID" "$APP"
          FRESH="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)"
          test ! -e "$FRESH/Documents/ci-persistence-marker.txt"
          echo 'PASS: uninstall/reinstall cleared sandbox marker'
          THIRD="$(xcrun simctl launch "$UDID" "$BUNDLE")"
          echo "THIRD: $THIRD"
          sleep 8
          xcrun simctl io "$UDID" screenshot "$OUTPUT/fresh-reinstall.png"
          printf '%s\n' \
            'PASS: cold relaunch without reinstall preserves app sandbox.' \
            'PASS: clean reinstall removes app sandbox data.' \
            'LIMITATION: No consent button was selected by automation; actual persisted UMP accept/reject and re-prompt behavior are NOT proven.' \
            'LIMITATION: Consent form may be required on every launch until a choice is made.' \
            > "$OUTPUT/summary.txt"
          cat "$OUTPUT/summary.txt"

      - name: Upload screenshots and read-only simulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro-iOS-simulator-coldstart-proof
          path: build/ios-ump-coldstart/
          if-no-files-found: warn
          retention-days: 14
