name: v93 Round Total + Symbols Fix

on:
  push:
    branches:
      - release/v93-round-total-checkout-symbols
  pull_request:
    branches:
      - ci/v93-build-base
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v92 reference
        run: git fetch origin release/v92-v79-prod-monetization:refs/remotes/origin/release/v92-v79-prod-monetization

      - name: Verify only requested source changes
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          def show(ref, path):
              return subprocess.check_output(
                  ["git", "show", f"{ref}:{path}"],
                  text=True
              )

          base_ref = "origin/release/v92-v79-prod-monetization"

          base_app = show(base_ref, "src/App.jsx")
          current_app = Path("src/App.jsx").read_text()

          old = """    if (tentative === 0) {
                let finishOk = true;

                if (anyOutSelected) {
                  finishOk = window.confirm(t(lang, 'confirmCheckoutRound'));
                }

                if (!finishOk) {
                  doBust();
                  return;
                }

                playHitSound();
          """
          new = """    if (tentative === 0) {
                // In "Round total" mode the entered total is authoritative.
                // If it exactly reaches zero, treat it as a valid checkout regardless
                // of Double-out / Triple-out. The app cannot infer the final dart here.
                playHitSound();
          """
          assert base_app.count(old) == 1, "Unexpected v92 round-total source"
          expected_app = base_app.replace(old, new, 1)
          assert current_app == expected_app, "src/App.jsx contains changes beyond the requested checkout fix"

          base_gradle = show(base_ref, "app/build.gradle")
          current_gradle = Path("app/build.gradle").read_text()

          expected_gradle = base_gradle.replace("versionCode 92", "versionCode 93", 1)
          expected_gradle = expected_gradle.replace('versionName "1.1.58"', 'versionName "1.1.59"', 1)

          anchor = """    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

"""
          replacement = """    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    packaging {
        jniLibs {
            // The only native code in the bundle is AndroidX DataStore's
            // multiprocess shared-counter helper. DartScore does not use
            // multiprocess DataStore, and this prebuilt library ships stripped,
            // which is what triggers the Play Console debug-symbol warning.
            excludes += "**/libdatastore_shared_counter.so"
        }
    }

"""
          assert expected_gradle.count(anchor) == 1, "Unexpected v92 Gradle source"
          expected_gradle = expected_gradle.replace(anchor, replacement, 1)
          assert current_gradle == expected_gradle, "app/build.gradle contains changes beyond version + DataStore native exclusion"

          unchanged = [
              "src/app.css",
              "src/main.jsx",
              "src/analyticsEvents.js",
              "src/botEngine.js",
              "index.html",
              "package.json",
              "vite.config.js",
              "app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java",
              "app/src/main/java/com/randis2288/dartscorepro/Application.java",
              "app/src/main/java/com/randis2288/dartscorepro/AdMobInterstitialManager.java",
              "app/src/main/java/com/randis2288/dartscorepro/AdMobInterstitialActivity.java",
          ]
          for path in unchanged:
              current = Path(path).read_text()
              assert current == show(base_ref, path), f"Unexpected change in {path}"

          print("v93 source diff verified: checkout fix + native-symbol warning fix only.")
          PY

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare bundled production UI
        run: python3 tools/apply-v78-offline-client.py

      - name: Build signed release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify no native .so remains
        run: |
          if unzip -l app/build/outputs/bundle/release/app-release.aab | grep -E 'base/lib/.+\.so$'; then
            echo "Unexpected native library remains in AAB"
            exit 1
          fi
          echo "No native .so libraries remain; Play native debug-symbol warning should no longer apply."

      - name: Verify AAB signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v93_1.1.59
          path: app/build/outputs/bundle/release/app-release.aab
