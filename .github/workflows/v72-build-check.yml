name: v81 analytics events

on:
  push:
    branches:
      - release/v81-analytics-events
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bring in tested web source with analytics events
        run: |
          git fetch origin feature/v81-analytics-events-web:refs/remotes/origin/feature/v81-analytics-events-web
          git show 34bb02a5ca5e56ef7ce1a3d048b365606d9772e0:src/App.jsx > src/App.jsx
          git show 34bb02a5ca5e56ef7ce1a3d048b365606d9772e0:src/main.jsx > src/main.jsx
          git show 34bb02a5ca5e56ef7ce1a3d048b365606d9772e0:src/analyticsEvents.js > src/analyticsEvents.js

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare v81 Android test build
        run: |
          sed -i 's/versionCode 78/versionCode 81/' app/build.gradle
          sed -i 's/versionName "1.1.44"/versionName "1.1.47"/' app/build.gradle
          python3 tools/apply-v78-offline-client.py

      - name: Verify combined source
        run: |
          grep -q "new OfflineWebViewClient" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "firebase-analytics" app/build.gradle
          grep -q "analytics_event" app/src/main/java/com/randis2288/dartscorepro/AdMobInterstitialActivity.java
          grep -q "game_started" src/analyticsEvents.js
          grep -q "game_completed" src/analyticsEvents.js
          grep -q "versionCode 81" app/build.gradle
          grep -q "versionName \"1.1.47\"" app/build.gradle
          grep -q "const STATS_I18N" src/App.jsx

      - name: Build release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v81_1.1.47
          path: app/build/outputs/bundle/release/app-release.aab
