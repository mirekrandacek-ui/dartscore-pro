name: v89 Embedded Hotfix Verification

on:
  push:
    branches:
      - release/v89-embedded-hotfix
  pull_request:
    branches:
      - release/v86-ad-inspector
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare offline fallback
        run: |
          python3 tools/apply-v78-offline-client.py

      - name: Verify v88 source
        run: |
          grep -q "new OfflineWebViewClient" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "firebase-analytics" app/build.gradle
          grep -q "analytics_event" app/src/main/java/com/randis2288/dartscorepro/AdMobInterstitialActivity.java
          grep -q "game_started" src/analyticsEvents.js
          grep -q "game_completed" src/analyticsEvents.js
          grep -q "versionCode 89" app/build.gradle
          grep -q "versionName \"1.1.54\"" app/build.gradle
          grep -q "com.google.ads.mediation:unity:4.16.6.0" app/build.gradle
          grep -q "requestConsentInfoUpdate" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "canRequestAds()" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "initializeMobileAdsAfterConsent" app/src/main/java/com/randis2288/dartscorepro/Application.java
          grep -q "debugSymbolLevel 'SYMBOL_TABLE'" app/build.gradle
          grep -q "openAdInspector" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "public void showInterstitial()" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "interstitialStartCount" src/App.jsx
          grep -q "interstitialPending" src/App.jsx
          grep -q "showPendingInterstitialAfterFanfare" src/App.jsx
          grep -q "startGame(false)" src/App.jsx
          grep -q "DartScoreAndroid?.showInterstitial" src/App.jsx
          grep -q 'START_URL = "https://dartscore-pro.vercel.app/"' app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q 'APP_HOST = "dartscore-pro.vercel.app"' app/src/main/java/com/randis2288/dartscorepro/OfflineWebViewClient.java
          ! grep -R -q "dartscore-v88-test.vercel.app" app/src/main/java src

      - name: Build release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify AAB native-code contents
        run: |
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q "base/lib/"
          echo "Release contains native libraries; SYMBOL_TABLE release configuration verified above."

      - name: Upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v89_1.1.55
          path: app/build/outputs/bundle/release/app-release.aab
