name: v91 Exact v79 UI Verification

on:
  push:
    branches:
      - release/v91-v79-ui-exact
  pull_request:
    branches:
      - ci/v91-build-base
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v79 reference sources
        run: |
          git fetch origin release/v79-final-i18n-test:refs/remotes/origin/release/v79-final-i18n-test
          git fetch origin preview/statistics-i18n:refs/remotes/origin/preview/statistics-i18n

      - name: Verify exact v79 UI support files
        run: |
          git diff --exit-code origin/release/v79-final-i18n-test -- src/app.css src/main.jsx
          ! grep -q "botEngine" src/App.jsx
          grep -q "const STATS_I18N" src/App.jsx
          grep -q "ThemedSelect" src/App.jsx
          grep -q "restart: 'Opakovat hru'" src/App.jsx
          grep -q "doubleOut: 'Double-out'" src/App.jsx
          grep -q "tripleOut: 'Triple-out'" src/App.jsx

      - name: Verify only requested interstitial behavior was added
        run: |
          grep -q "interstitialStartCount" src/App.jsx
          grep -q "interstitialPending" src/App.jsx
          grep -q "showPendingInterstitialAfterFanfare" src/App.jsx
          grep -q "startGame(false)" src/App.jsx
          ! grep -q "playedVisitsRef" src/App.jsx
          ! grep -q "playedGamesSinceAdRef" src/App.jsx

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build exact v79-derived web bundle
        run: |
          npm ci
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare bundled WebView app
        run: |
          python3 tools/apply-v78-offline-client.py

      - name: Verify Android shell and mediation
        run: |
          grep -q "versionCode 91" app/build.gradle
          grep -q "versionName \"1.1.57\"" app/build.gradle
          grep -q "com.google.ads.mediation:unity:4.16.6.0" app/build.gradle
          grep -q "new OfflineWebViewClient" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q 'APP_HOST = "dartscore-pro.vercel.app"' app/src/main/java/com/randis2288/dartscorepro/OfflineWebViewClient.java
          ! grep -R -q "dartscore-v88-test.vercel.app" app/src/main/java src

      - name: Build release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v91_1.1.57
          path: app/build/outputs/bundle/release/app-release.aab
