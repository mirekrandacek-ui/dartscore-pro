name: v80 final i18n test

on:
  push:
    branches:
      - release/v80-final-i18n-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bring in tested statistics translations
        run: |
          git fetch origin preview/statistics-i18n:refs/remotes/origin/preview/statistics-i18n
          git show 54629103847c1a930d91ae6cd4477691f3efd478:src/App.jsx > src/App.jsx

      - name: Build translated web bundle
        run: |
          npm ci
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare v80 Android test build
        run: |
          sed -i 's/versionCode 78/versionCode 80/' app/build.gradle
          sed -i 's/versionName "1.1.44"/versionName "1.1.46"/' app/build.gradle
          python3 tools/apply-v78-offline-client.py

      - name: Verify combined source
        run: |
          grep -q "new OfflineWebViewClient" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "user-messaging-platform:4.0.0" app/build.gradle
          grep -q "versionCode 80" app/build.gradle
          grep -q "versionName \"1.1.46\"" app/build.gradle
          grep -q "const STATS_I18N" src/App.jsx

      - name: Build release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dartscore-pro-v80-final-i18n-test-aab
          path: app/build/outputs/bundle/release/app-release.aab
