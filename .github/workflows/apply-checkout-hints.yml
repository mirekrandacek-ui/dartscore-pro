name: Apply checkout hints preview

on:
  push:
    branches:
      - feature/checkout-hints-preview

permissions:
  contents: write

jobs:
  apply-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-hints-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/checkout-hints-preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused checkout hint patch
        run: node scripts/apply-checkout-hints.mjs

      - name: Build
        run: npm run build

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: add checkout hints preview [checkout-hints-applied]"
          git push origin HEAD:feature/checkout-hints-preview
