name: v73 bottom banner build

on:
  push:
    branches:
      - release/v73-banner-bottom

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v73-banner-bottom
          fetch-depth: 0

      - name: Apply banner patch
        run: python3 scripts/patch_v73_banner.py

      - name: Verify exact native scope
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          j = Path('app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java').read_text(encoding='utf-8')
          g = Path('app/build.gradle').read_text(encoding='utf-8')
          assert 'versionCode 73' in g and 'versionName "1.1.39"' in g
          assert 'Gravity.BOTTOM' in j
          assert 'bottomSystemInsetPx' in j
          assert 'visibleBannerHeight + bottomSystemInsetPx' in j
          assert 'WindowInsets.Type.navigationBars()' in j
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: dartscore-pro-v73-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm scripts/patch_v73_banner.py .github/workflows/v73-banner-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java scripts/patch_v73_banner.py .github/workflows/v73-banner-build.yml
          git commit -m "v73: move Free banner safely to bottom"
          git push origin HEAD:release/v73-banner-bottom
