name: v74 Free banner inset test

on:
  push:
    branches:
      - release/v74-free-banner-insets-test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v74-free-banner-insets-test
          fetch-depth: 0

      - name: Apply v74 test patch
        run: python3 scripts/patch_v74_test.py

      - name: Verify exact test changes
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          j = Path('app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java').read_text(encoding='utf-8')
          g = Path('app/build.gradle').read_text(encoding='utf-8')
          assert 'FORCE_FREE_BANNER_TEST = true' in j
          assert 'WindowInsets.Type.navigationBars()' in j
          assert 'WindowInsets.Type.mandatorySystemGestures()' in j
          assert 'WindowInsets.Type.displayCutout()' in j
          assert 'Math.max(navBottom, Math.max(gestureBottom, cutoutBottom))' in j
          assert '(isDebug || FORCE_FREE_BANNER_TEST) ? TEST_BANNER_ID : PROD_BANNER_ID' in j
          assert 'versionCode 74' in g
          assert 'versionName "1.1.40"' in g
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace
          mkdir -p app/aab-out
          cp app/build/outputs/bundle/release/app-release.aab app/aab-out/DartScore-Pro-v74-test.aab

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: dartscore-pro-v74-test-aab
          path: app/aab-out/DartScore-Pro-v74-test.aab

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm scripts/patch_v74_test.py .github/workflows/v74-test-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java scripts/patch_v74_test.py .github/workflows/v74-test-build.yml
          git commit -m "v74: force Free banner with safe bottom insets"
          git push origin HEAD:release/v74-free-banner-insets-test
