name: Finalize compact game header
on:
  push:
    branches: [ui/compact-game-header]
    paths:
      - '.github/workflows/finalize-compact-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fixes
        run: python .github/scripts/fix_compact_header.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify compact header
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/App.jsx').read_text(encoding='utf-8')
          assert "const classicOutShortLabel = (() =>" in s
          assert "t(lang, 'roundCount')" in s
          assert "${t(lang, 'target')}: ${rouletteTargetLabel" not in s
          assert "roundCount: 'Počet kol'" in s
          assert s.count('roundCount:') == 7
          print('compact header verification OK')
          PY
      - name: Commit fixes and clean temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fix Classic header and show roulette round count"
          git rm -f .github/scripts/fix_compact_header.py .github/workflows/fix-compact-header.yml .github/workflows/finalize-compact-header.yml || true
          git rm -f .github/workflows/fix-compact-header-trigger.txt || true
          git rm -f .github/scripts/trigger-fix*.txt || true
          git rm -f .github/scripts/fix_compact_header.py.tmp || true
          git rm -f .github/scripts/fix_compact_header_trigger*.py || true
          git add -A
          git commit -m "Remove temporary compact header helpers"
          git push
