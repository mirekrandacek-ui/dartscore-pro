name: Bootstrap iOS project

on:
  push:
    branches:
      - feature/ios-v97
    paths:
      - .github/workflows/ios-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-ios:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        with:
          ref: feature/ios-v97
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor 8.5
        run: |
          npm install @capacitor/core@8.5.0 @capacitor/ios@8.5.0 --save-exact
          npm install @capacitor/cli@8.5.0 --save-dev --save-exact

      - name: Build web app
        run: npm run build

      - name: Generate iOS project
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: Verify iOS project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          grep -q "com.randis2288.dartscorepro" ios/App/App.xcodeproj/project.pbxproj
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 15.0" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Commit generated iOS project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json capacitor.config.json ios
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "feat(ios): generate Capacitor iOS project"
            git push origin HEAD:feature/ios-v97
          fi
