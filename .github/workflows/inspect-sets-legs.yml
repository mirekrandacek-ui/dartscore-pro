name: Inspect sets legs integration
on:
  push:
    branches: [feature/classic-sets-legs-share]
    paths: ['.github/workflows/inspect-sets-legs.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect integration points
        run: |
          echo '=== STATES ==='
          grep -n -A35 -B10 "const \[outDouble" src/App.jsx || true
          echo '=== LOBBY RESTORE/SAVE ==='
          grep -n -A45 -B12 "ukládej lobby" src/App.jsx || true
          grep -n -A35 -B12 "setOutDouble" src/App.jsx | head -n 120 || true
          echo '=== START GAME ==='
          grep -n -A110 -B15 "const startGame =" src/App.jsx || true
          echo '=== FINALIZE ==='
          grep -n -A75 -B15 "const finalizeWin =" src/App.jsx || true
          echo '=== LOBBY FUNCTION ==='
          grep -n -A260 -B10 "function Lobby" src/App.jsx || true
          echo '=== GAME CALL ==='
          grep -n -A80 -B15 "<Game" src/App.jsx | tail -n 120 || true
          echo '=== CLASSIC CARDS ==='
          grep -n -A90 -B30 "playerScore" src/App.jsx | tail -n 220 || true
          echo '=== SNAPSHOT ==='
          grep -n -A55 -B10 "const makeSnapshot" src/App.jsx || true
