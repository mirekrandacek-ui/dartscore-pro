name: Patch language fallback
on:
  push:
    branches: [fix/native-share-bridge-web]
    paths:
      - '.github/workflows/patch-lang-fallback.yml'
      - '.github/scripts/patch_lang_fallback.py'
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python .github/scripts/patch_lang_fallback.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text(encoding='utf-8')
          assert "navigator.language || 'en'" in s
          assert "['cs', 'en', 'de', 'es', 'nl', 'ru', 'zh'].includes(detectedLang)" in s
          assert ": 'en';" in s
          assert 'window.DartScoreAndroid?.shareApp' in s
          print('language fallback verification OK')
          PY
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fallback unsupported device languages to English"
          git rm -f .github/scripts/patch_lang_fallback.py .github/workflows/patch-lang-fallback.yml
          git commit -m "Remove temporary language fallback helpers"
          git restore dist || true
          git push origin HEAD:fix/native-share-bridge-web
