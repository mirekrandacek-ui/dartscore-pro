name: Build v95 AAB

on:
  push:
    branches:
      - release/v95-meta-adapter
    paths:
      - app/build.gradle
      - .github/workflows/build-v95-aab.yml
  pull_request:
    branches:
      - release/v94c-remove-winner-voice

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload v95 AAB
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro-v95-1.1.61
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
