name: Fix compact game header
on:
  push:
    branches: [ui/compact-game-header]
    paths:
      - '.github/workflows/fix-compact-header.yml'
      - '.github/scripts/fix_compact_header.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fixes
        run: python .github/scripts/fix_compact_header.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify compact header
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/App.jsx').read_text(encoding='utf-8')
          assert "const classicOutShortLabel = (() =>" in s
          assert "t(lang, 'roundCount')" in s
          assert "${t(lang, 'target')}: ${rouletteTargetLabel" not in s
          assert "roundCount: 'Počet kol'" in s
          assert s.count('roundCount:') == 7
          print('compact header verification OK')
          PY
      - name: Commit source and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fix Classic compact header and roulette round label"
          git rm .github/scripts/fix_compact_header.py .github/workflows/fix-compact-header.yml
          git commit -m "Remove temporary compact header fix helpers"
          git push
