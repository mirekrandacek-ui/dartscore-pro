name: DartScore v102 integration into main
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/v102-1.1.68-into-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    # This historical version-102 release check must not fail modern v104+ PRs.
    if: github.event_name != 'pull_request' || github.head_ref == 'integration/v102-1.1.68-into-main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build
      - name: Check v102 and retained production web files
        run: |
          set -euo pipefail
          grep -q 'versionCode 102' app/build.gradle
          grep -q 'versionName "1.1.68"' app/build.gradle
          grep -q "const APP_VERSION = '1.1.68'" src/App.jsx
          grep -q 'claimBeforeAdShow' app/src/main/java/com/randis2288/dartscorepro/AdMobInterstitialManager.java
          grep -q 'LAST_ATTEMPT_AT' app/src/main/java/com/randis2288/dartscorepro/InterstitialCadence.java
          test -s public/app-ads.txt
          test -s public/about/index.html
          test -s public/how-to-play/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          test -s public/privacy/index.html
          test -s public/support.html
          test -s ios/App/App.xcodeproj/project.pbxproj
      - name: Check signing secrets are not tracked
        run: |
          set -euo pipefail
          test ! -e android.keystore
          test ! -e app/signing.keystore
          ! grep -q '^MYAPP_UPLOAD_STORE_PASSWORD=' gradle.properties
          ! grep -q '^MYAPP_UPLOAD_KEY_PASSWORD=' gradle.properties
          grep -q '^\*.keystore$' .gitignore
          grep -q '^\*.jks$' .gitignore
          grep -q '^keystore.properties$' .gitignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned release bundle and debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleDebug --stacktrace --no-daemon
      - name: Verify Android artifacts
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep 'base/assets/offline/index.html'
