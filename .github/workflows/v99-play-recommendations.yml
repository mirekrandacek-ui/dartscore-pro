name: v99 Android 15-16 Play recommendations

on:
  push:
    branches:
      - release/v99-android15-16-play-recommendations
    paths:
      - 'src/**'
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'package.json'
      - '.github/workflows/v99-play-recommendations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-qa-and-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v99
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run existing app tests
        run: npm test

      - name: Build frozen web bundle
        run: npm run build

      - name: Verify v99 Play recommendation changes
        run: |
          set -euo pipefail
          grep -q 'versionCode 99' app/build.gradle
          grep -q 'versionName "1.1.65"' app/build.gradle
          grep -q "const APP_VERSION = '1.1.65'" src/App.jsx
          grep -q "com.android.tools.build:gradle:9.3.3" build.gradle
          grep -q "gradle-9.5.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          grep -q "optimization {" app/build.gradle
          grep -q "enable = true" app/build.gradle
          grep -q "androidbrowserhelper:2.7.4" app/build.gradle
          grep -q "androidx.core:core:1.17.0" app/build.gradle
          grep -q "WindowCompat.enableEdgeToEdge" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          grep -q "WindowInsetsCompat.Type.displayCutout()" app/src/main/java/com/randis2288/dartscorepro/MainWebViewActivity.java
          ! grep -q 'android:screenOrientation="portrait"' app/src/main/AndroidManifest.xml
          ! grep -q 'android.support.customtabs.trusted.SCREEN_ORIENTATION' app/src/main/AndroidManifest.xml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Analyze release R8 configuration
        run: |
          chmod +x gradlew
          ./gradlew :app:analyzeReleaseR8Config --stacktrace --no-daemon

      - name: Build signed Android App Bundle
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Verify optimized release outputs and signature
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/mapping/release/resources.txt
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'base/assets/offline/index.html'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named AAB
        run: cp app/build/outputs/bundle/release/app-release.aab DartScorePro_v99_1.1.65.aab

      - name: Upload signed v99 AAB
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_v99_1.1.65_AAB
          path: DartScorePro_v99_1.1.65.aab
          if-no-files-found: error
          retention-days: 14
