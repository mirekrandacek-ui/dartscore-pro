name: Capture iPad simulator screenshot

on:
  push:
    branches:
      - feature/ios-v97
    paths:
      - .github/workflows/ios-ipad-screenshot.yml

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build for iPad Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create and boot 13-inch iPad simulator
        run: |
          set -euo pipefail

          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devicetypes"]; xs=[x for x in d if "iPad Pro 13-inch" in x["name"]]; print(xs[-1]["identifier"] if xs else "")')"
          if [ -z "$DEVICE_TYPE_ID" ]; then
            echo "No 13-inch iPad Pro device type found."
            xcrun simctl list devicetypes
            exit 1
          fi

          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["runtimes"]; xs=[x for x in d if x.get("isAvailable") and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(xs[-1]["identifier"] if xs else "")')"
          if [ -z "$RUNTIME_ID" ]; then
            echo "No available iOS runtime found."
            xcrun simctl list runtimes
            exit 1
          fi

          UDID="$(xcrun simctl create "DartScore iPad 13" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "DEVICE_TYPE_ID=$DEVICE_TYPE_ID"
          echo "RUNTIME_ID=$RUNTIME_ID"
          echo "UDID=$UDID"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLocale en_US

      - name: Install, launch, and capture
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/ios-derived/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP_PATH"

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" com.randis2288.dartscorepro

          sleep 12

          mkdir -p "$RUNNER_TEMP/ipad-shot"
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/ipad-shot/DartScore_iPad_13_EN_lobby.png"

          python3 - <<'PY'
          from PIL import Image
          import os
          p=os.path.join(os.environ["RUNNER_TEMP"],"ipad-shot","DartScore_iPad_13_EN_lobby.png")
          im=Image.open(p)
          print("SCREENSHOT_SIZE", im.size)
          PY

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartScore_iPad_13_EN_sample
          path: ${{ runner.temp }}/ipad-shot/DartScore_iPad_13_EN_lobby.png
          if-no-files-found: error
