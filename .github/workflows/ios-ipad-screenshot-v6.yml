name: Capture iPad simulator screenshot v6

on:
  push:
    branches:
      - feature/ios-v97
    paths:
      - .github/workflows/ios-ipad-screenshot-v6.yml

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare and build
        run: |
          npm ci
          npm run build
          npx cap sync ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot 13-inch iPad and wait for SpringBoard
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          key=next(k for k in d if k.endswith("iOS-26-5"))
          xs=[x for x in d[key] if x.get("isAvailable") and x["name"]=="iPad Pro 13-inch (M5)"]
          print(xs[0]["udid"])
          ')"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using $UDID"

          open -a Simulator --args -CurrentDeviceUDID "$UDID" >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" >/tmp/dartscore-boot.log 2>&1 || true

          python3 - "$UDID" <<'PY'
          import subprocess,sys,time,json
          u=sys.argv[1]

          # Wait until CoreSimulator reports Booted.
          for _ in range(120):
              d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","-j"]))["devices"]
              state=next((x["state"] for xs in d.values() for x in xs if x["udid"]==u),"Missing")
              print("state",state,flush=True)
              if state=="Booted":
                  break
              time.sleep(2)
          else:
              raise SystemExit("Simulator did not reach Booted")

          # Then wait for SpringBoard to exist and stay ready.
          for i in range(180):
              p=subprocess.run(
                  ["xcrun","simctl","spawn",u,"launchctl","print","system/com.apple.SpringBoard"],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL
              )
              if p.returncode==0:
                  print("SpringBoard ready",flush=True)
                  break
              if i % 10 == 0:
                  print("waiting for SpringBoard",flush=True)
              time.sleep(2)
          else:
              raise SystemExit("SpringBoard never became ready")

          # Extra settling time so the Apple boot progress screen is gone.
          time.sleep(45)
          PY

      - name: Install and launch DartScore
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/ios-derived/Build/Products/Release-iphonesimulator/App.app"
          SHOT="$RUNNER_TEMP/DartScore_iPad_13_EN_lobby.png"

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl spawn "$SIM_UDID" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$SIM_UDID" defaults write NSGlobalDomain AppleLocale en_US

          python3 - "$SIM_UDID" <<'PY'
          import subprocess,sys,time
          u=sys.argv[1]
          cmd=["xcrun","simctl","launch","--terminate-running-process",u,"com.randis2288.dartscorepro"]
          try:
              r=subprocess.run(cmd,timeout=30,text=True,capture_output=True)
              print("launch rc",r.returncode)
              print(r.stdout)
              print(r.stderr)
          except subprocess.TimeoutExpired:
              print("launch command timed out; app may still have launched")
          time.sleep(35)
          PY

          xcrun simctl io "$SIM_UDID" screenshot "$SHOT"
          sips -g pixelWidth -g pixelHeight "$SHOT"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: DartScore_iPad_13_EN_real_v6
          path: ${{ runner.temp }}/DartScore_iPad_13_EN_lobby.png
          if-no-files-found: error
