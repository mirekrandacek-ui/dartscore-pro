name: X01 score fix - Android test and iOS TestFlight 7

on:
  push:
    branches:
      - test/x01-score-clipping-20261018
    paths:
      - .github/workflows/x01-score-test-builds.yml
      - qa/android-score-clipping.mjs

permissions:
  contents: read

concurrency:
  group: x01-test-build7
  cancel-in-progress: false

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build test APK (no Play upload)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk DartScorePro_X01_test.apk
      - name: Retain test APK
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_X01_test_APK
          path: DartScorePro_X01_test.apk
          if-no-files-found: error
      - name: Install UI test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps webkit chromium
      - name: Verify WebKit and Chromium at all four widths
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dartscore-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node qa/x01-score-clipping.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android scoring WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node qa/android-score-clipping.mjs
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X01_test_UI_evidence
          path: |
            build/x01-score-evidence/
            build/android-score-evidence/
          if-no-files-found: ignore

  ios-testflight:
    needs: android-test
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frozen web bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_PRIVATE_KEY"
          KEY_DIR="$RUNNER_TEMP/appstore-key"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify release identity
        run: |
          grep -q "DEVELOPMENT_TEAM = MQG667M2B8;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.randis2288.dartscorepro;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = 1.1.63;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = 7;" ios/App/App.xcodeproj/project.pbxproj

      - name: Create unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Normalize embedded framework signatures
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DartScorePro.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH/Frameworks"
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            echo "Ad-hoc signing $(basename "$framework") before cloud export"
            codesign --remove-signature "$framework" 2>/dev/null || true
            codesign --force --sign - --timestamp=none "$framework"
          done
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>MQG667M2B8</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/DartScorePro.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$APPSTORE_KEY_PATH"             -authenticationKeyID "$APPSTORE_KEY_ID"             -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/App.ipa"
          mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/export/DartScorePro_1.1.63_build7.ipa"

      - name: Validate IPA with App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            -f "$RUNNER_TEMP/export/DartScorePro_1.1.63_build7.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Upload build to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            -f "$RUNNER_TEMP/export/DartScorePro_1.1.63_build7.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --p8-file-path "$APPSTORE_KEY_PATH"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartScorePro_iOS_1.1.63_build7
          path: ${{ runner.temp }}/export/DartScorePro_1.1.63_build7.ipa
          if-no-files-found: error

      - name: Assign build 7 to internal TestFlight testers
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/asc_assign_internal_build7.rb
