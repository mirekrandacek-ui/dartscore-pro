name: Apply checkout out-rules cleanup

on:
  push:
    branches:
      - preview/checkout-out-rules-cleanup

permissions:
  contents: write

jobs:
  apply-build:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-rules-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/checkout-out-rules-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused patch
        run: node scripts/apply-checkout-out-rules-cleanup.mjs

      - name: Build
        run: npm run build

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: simplify checkout out rules and hints [checkout-rules-applied]"
          git push origin HEAD:preview/checkout-out-rules-cleanup
