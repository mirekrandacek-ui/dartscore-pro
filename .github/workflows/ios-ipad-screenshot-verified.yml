name: Capture verified English iPad screenshot
on:
  push:
    branches: [feature/ios-v97]
    paths: [.github/workflows/ios-ipad-screenshot-verified.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Cancel superseded screenshot attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-ipad-screenshot-verified.yml --branch feature/ios-v97 --limit 10 --json databaseId,status | jq -r --arg current "$GITHUB_RUN_ID" '.[] | select((.status == "in_progress" or .status == "queued") and (.databaseId|tostring) != $current) | .databaseId' | while read -r run; do
            gh run cancel "$run" --repo "$GITHUB_REPOSITORY" || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare app and temporary UI test
        env:
          GEM_HOME: ${{ runner.temp }}/gems
          GEM_PATH: ${{ runner.temp }}/gems
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx cap sync ios
          gem install xcodeproj --no-document
          mkdir -p ios/App/CaptureUITests
          cat > ios/App/CaptureUITests/Capture.swift <<'SWIFT'
          import XCTest
          final class Capture: XCTestCase {
              let app = XCUIApplication(bundleIdentifier: "com.randis2288.dartscorepro")
              func button(_ label: String) -> XCUIElement {
                  let q = app.buttons.matching(NSPredicate(format: "label == %@", label))
                  let e = q.firstMatch
                  XCTAssertTrue(e.waitForExistence(timeout: 15), "Missing button: \(label)\n\(app.debugDescription)")
                  return e
              }
              func tap(_ label: String) { button(label).tap() }
              func option(_ label: String) {
                  let q = app.descendants(matching: .any).matching(NSPredicate(format: "label == %@", label))
                  let matches = q.allElementsBoundByIndex.filter { $0.isHittable }
                  XCTAssertFalse(matches.isEmpty, "Missing option: \(label)\n\(app.debugDescription)")
                  matches.last?.tap()
              }
              func shot(_ name: String) {
                  XCTAssertEqual(app.state, .runningForeground)
                  sleep(2)
                  let a = XCTAttachment(screenshot: XCUIScreen.main.screenshot())
                  a.name = name
                  a.lifetime = .keepAlways
                  add(a)
                  print("CAPTURED_REAL_IPAD_SCREEN \(name)")
              }
              func back() { tap("Back"); XCTAssertTrue(button("Classic").exists) }
              func testEightScreens() {
                  continueAfterFailure = false
                  XCUIDevice.shared.orientation = .portrait
                  app.launchArguments = ["-AppleLanguages", "(en)", "-AppleLocale", "en_US"]
                  app.launch()
                  XCTAssertTrue(app.wait(for: .runningForeground, timeout: 90))
                  let start = app.buttons.matching(NSPredicate(format: "label CONTAINS %@", "Start Game")).firstMatch
                  XCTAssertTrue(start.waitForExistence(timeout: 90))
                  // Menu and language picker use the application's existing controls.
                  tap("Classic")
                  XCTAssertTrue(app.descendants(matching: .any).matching(NSPredicate(format: "label == %@", "Roulette Double")).firstMatch.waitForExistence(timeout: 10))
                  shot("02_five-modes")
                  option("Classic")
                  tap("English")
                  XCTAssertTrue(app.descendants(matching: .any).matching(NSPredicate(format: "label == %@", "Español")).firstMatch.waitForExistence(timeout: 10))
                  shot("08_multi-language")
                  option("English")
                  tap("Individuals"); option("Teams")
                  shot("06_team-mode")
                  tap("Teams"); option("Individuals")
                  start.tap()
                  XCTAssertTrue(button("20").exists)
                  shot("01_fast-simple")
                  tap("Back")
                  // Reach 170 by actual entered darts: 301 - T20 - T17 - D10.
                  tap("301"); start.tap()
                  tap("TRIPLE"); tap("20")
                  tap("TRIPLE"); tap("17")
                  tap("DOUBLE"); tap("10")
                  tap("0"); tap("0"); tap("0")
                  shot("04_checkout-hints")
                  tap("Back")
                  // Finish one real short match for saved statistics: 101 - T20 - 1 - D20.
                  tap("101"); start.tap()
                  tap("TRIPLE"); tap("20"); tap("1"); tap("DOUBLE"); tap("20")
                  sleep(5)
                  tap("Back")
                  let h2h = app.buttons["Head-to-Head"].firstMatch
                  for _ in 0..<6 {
                      if h2h.exists && h2h.isHittable { break }
                      app.swipeUp()
                  }
                  XCTAssertTrue(h2h.exists && h2h.isHittable, app.debugDescription)
                  h2h.tap()
                  // Scroll to the statistics portion, keeping actual application layout.
                  app.swipeUp()
                  shot("05_statistics")
                  for _ in 0..<6 {
                      if app.buttons["Classic"].firstMatch.isHittable { break }
                      app.swipeDown()
                  }
                  tap("Classic"); option("Roulette Double")
                  start.tap()
                  let draw = app.buttons.matching(NSPredicate(format: "label CONTAINS %@", "Draw")).firstMatch
                  XCTAssertTrue(draw.waitForExistence(timeout: 15)); draw.tap()
                  sleep(4)
                  shot("03_doubles")
                  tap("Back")
                  tap("Roulette Double"); option("Cricket")
                  start.tap()
                  tap("20"); tap("20"); tap("19")
                  tap("TRIPLE"); tap("18"); tap("19"); tap("25")
                  shot("07_cricket")
              }
          }
          
          SWIFT
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |t| t.name == 'App' }
          test = project.new_target(:ui_test_bundle, 'CaptureUITests', :ios, '15.0')
          test.add_dependency(app)
          group = project.main_group.new_group('CaptureUITests', 'CaptureUITests')
          test.add_file_references([group.new_file('Capture.swift')])
          test.build_configurations.each do |c|
            c.build_settings['PRODUCT_NAME'] = 'CaptureUITests'
            c.build_settings['GENERATE_INFOPLIST_FILE'] = 'YES'
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.randis2288.dartscorepro.capturetests'
            c.build_settings['TEST_TARGET_NAME'] = 'App'
            c.build_settings['SWIFT_VERSION'] = '5.0'
            c.build_settings['TARGETED_DEVICE_FAMILY'] = '2'
            c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
          end
          project.save
          scheme = Xcodeproj::XCScheme.new
          scheme.add_build_target(app)
          scheme.add_build_target(test)
          scheme.add_test_target(test)
          scheme.test_action.build_configuration = 'Release'
          scheme.save_as(project.path, 'Capture', true)
          RUBY
      - name: Select real 13-inch iPad
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          choices=[(runtime,d) for runtime,ds in data.items() for d in ds
                   if runtime.endswith('iOS-18-5') and d.get('isAvailable') and d['name'].startswith('iPad Pro 13-inch')]
          assert choices, 'No 13-inch iPad available'
          runtime,d=choices[-1]
          print(runtime,d)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIM_UDID='+d['udid']+'\n')
          PY
      - name: Launch, verify English UI and capture
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess,os
          cmd=['xcodebuild','test','-project','ios/App/App.xcodeproj','-scheme','Capture','-configuration','Release','-destination','platform=iOS Simulator,id='+os.environ['SIM_UDID'],'-parallel-testing-enabled','NO','-maximum-concurrent-test-simulator-destinations','1','-derivedDataPath','build/ios-capture','-resultBundlePath',os.environ['RUNNER_TEMP']+'/Capture.xcresult','-test-timeouts-enabled','YES','-default-test-execution-time-allowance','480','-maximum-test-execution-time-allowance','540','CODE_SIGNING_ALLOWED=NO']
          try:
              result=subprocess.run(cmd,timeout=660)
              raise SystemExit(result.returncode)
          except subprocess.TimeoutExpired:
              raise SystemExit('Build and capture exceeded 11 minute limit')
          PY
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/capture-output"
          if [ -d "$RUNNER_TEMP/Capture.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Capture.xcresult" --output-path "$RUNNER_TEMP/capture-output"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DartScore_iPad_13_EN_eight_screens
          path: ${{ runner.temp }}/capture-output
          if-no-files-found: warn
