<script>
const c={
en:{title:"Privacy Policy",date:"Effective date: 10 October 2026",sections:[
["1. Local app data","DartScore Pro stores game information such as scores, players, unfinished games, settings and statistics locally on your device. This information is used to provide app functionality and is not intentionally sent to DartScore Pro servers."],
["2. Advertising","The free version may display ads using Google AdMob / Google Mobile Ads. Depending on your location, consent choices and device settings, Google and its advertising partners may process information including IP address and approximate location, device identifiers, advertising data, app interactions, crash data and performance data. Such data may be used for advertising, analytics, app functionality and, where permitted, tracking."],
["3. Consent and tracking choices","Where required, advertising consent choices are handled through Google User Messaging Platform and device privacy controls. On Apple devices, tracking is subject to Apple's App Tracking Transparency rules and the user's permission where applicable."],
["4. In-app purchases","Premium is a one-time purchase processed by Apple StoreKit on iPhone/iPad or Google Play Billing on Android. DartScore Pro does not receive your full payment-card or bank details. The app may check the purchase entitlement on the device to unlock Premium; DartScore Pro does not operate a server that stores your purchase history."],
["5. Voice features","Voice announcements use operating-system text-to-speech services. DartScore Pro does not intentionally record your voice or use voice output to create a personal profile."],
["6. Data retention","Game data stored locally remains on your device until it is overwritten, cleared or removed with the app's data. Data processed by third-party providers is retained according to their own policies and legal obligations."],
["7. Your choices and rights","You can manage advertising and privacy choices through consent controls shown in the app and through your device settings. Depending on your jurisdiction, you may also have rights such as access, correction, deletion, restriction, objection or withdrawal of consent."],
["8. Third-party services","Services used by DartScore Pro may include Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing and operating-system services. Their processing is governed by their own privacy policies."],
["9. Contact","For privacy questions, contact randis@email.cz."]
]},
cs:{title:"Zásady ochrany soukromí",date:"Platné od: 10. října 2026",sections:[
["1. Data uložená v aplikaci","DartScore Pro ukládá herní údaje, například skóre, hráče, rozehrané hry, nastavení a statistiky, lokálně ve vašem zařízení. Slouží k fungování aplikace a nejsou úmyslně odesílány na servery DartScore Pro."],
["2. Reklama","Bezplatná verze může zobrazovat reklamy prostřednictvím Google AdMob / Google Mobile Ads. V závislosti na poloze, volbách souhlasu a nastavení zařízení mohou Google a jeho reklamní partneři zpracovávat IP adresu a přibližnou polohu, identifikátory zařízení, reklamní údaje, interakce s aplikací, údaje o pádech a výkonu. Tyto údaje mohou být používány pro reklamu, analytiku, fungování aplikace a tam, kde je to povoleno, pro sledování."],
["3. Souhlas a sledování","Kde je to vyžadováno, volby souhlasu s reklamou jsou řešeny přes Google User Messaging Platform a nastavení soukromí zařízení. Na zařízeních Apple se sledování řídí pravidly App Tracking Transparency a souhlasem uživatele, pokud je vyžadován."],
["4. Nákupy v aplikaci","Premium je jednorázový nákup zpracovaný přes Apple StoreKit na iPhonu/iPadu nebo Google Play Billing na Androidu. DartScore Pro nezískává kompletní údaje o platební kartě ani bankovním účtu. Aplikace může na zařízení ověřit nárok na Premium; DartScore Pro neprovozuje server, který by ukládal historii vašich nákupů."],
["5. Hlasové funkce","Hlasová oznámení používají systémové služby převodu textu na řeč. DartScore Pro úmyslně nenahrává váš hlas ani nepoužívá hlasový výstup k vytváření osobního profilu."],
["6. Uchování dat","Lokálně uložená herní data zůstávají v zařízení, dokud nejsou přepsána, vymazána nebo odstraněna společně s daty aplikace. Data zpracovávaná třetími stranami jsou uchovávána podle jejich vlastních zásad a právních povinností."],
["7. Vaše volby a práva","Nastavení reklamy a soukromí můžete spravovat prostřednictvím voleb souhlasu v aplikaci a nastavení zařízení. Podle vaší jurisdikce můžete mít také práva na přístup, opravu, výmaz, omezení, námitku nebo odvolání souhlasu."],
["8. Služby třetích stran","DartScore Pro může používat Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing a systémové služby zařízení. Zpracování dat těmito službami se řídí jejich vlastními zásadami ochrany soukromí."],
["9. Kontakt","Dotazy k ochraně soukromí posílejte na randis@email.cz."]
]},
de:{title:"Datenschutzerklärung",date:"Gültig ab: 10. Oktober 2026",sections:[
["1. Lokale App-Daten","DartScore Pro speichert Spielinformationen wie Punkte, Spieler, nicht beendete Spiele, Einstellungen und Statistiken lokal auf deinem Gerät. Diese Daten dienen der App-Funktion und werden nicht absichtlich an DartScore-Pro-Server gesendet."],
["2. Werbung","Die kostenlose Version kann Werbung über Google AdMob / Google Mobile Ads anzeigen. Abhängig von Standort, Einwilligung und Geräteeinstellungen können Google und Werbepartner u. a. IP-Adresse und ungefähren Standort, Gerätekennungen, Werbedaten, App-Interaktionen, Absturz- und Leistungsdaten verarbeiten. Diese Daten können für Werbung, Analyse, App-Funktionalität und, sofern zulässig, Tracking verwendet werden."],
["3. Einwilligung und Tracking","Wo erforderlich, werden Werbeeinwilligungen über die Google User Messaging Platform und die Datenschutzeinstellungen des Geräts verwaltet. Auf Apple-Geräten unterliegt Tracking den App-Tracking-Transparency-Regeln und gegebenenfalls der Einwilligung des Nutzers."],
["4. In-App-Käufe","Premium ist ein einmaliger Kauf über Apple StoreKit auf iPhone/iPad oder Google Play Billing auf Android. DartScore Pro erhält keine vollständigen Karten- oder Bankdaten. Die App kann die Kaufberechtigung auf dem Gerät prüfen; DartScore Pro betreibt keinen Server, der deine Kaufhistorie speichert."],
["5. Sprachfunktionen","Sprachausgaben verwenden die Text-to-Speech-Dienste des Betriebssystems. DartScore Pro zeichnet deine Stimme nicht absichtlich auf und erstellt daraus kein persönliches Profil."],
["6. Datenspeicherung","Lokal gespeicherte Spieldaten bleiben auf deinem Gerät, bis sie überschrieben, gelöscht oder zusammen mit den App-Daten entfernt werden. Drittanbieter speichern Daten gemäß ihren eigenen Richtlinien und gesetzlichen Pflichten."],
["7. Deine Rechte","Werbe- und Datenschutzeinstellungen kannst du über die Einwilligungsoptionen der App und deine Geräteeinstellungen verwalten. Je nach Rechtsraum können weitere Rechte wie Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch oder Widerruf bestehen."],
["8. Drittanbieter","DartScore Pro kann Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing und Betriebssystemdienste verwenden. Für deren Datenverarbeitung gelten die jeweiligen Datenschutzrichtlinien."],
["9. Kontakt","Datenschutzfragen: randis@email.cz."]
]},
es:{title:"Política de privacidad",date:"Fecha de entrada en vigor: 10 de octubre de 2026",sections:[
["1. Datos locales de la aplicación","DartScore Pro guarda localmente en tu dispositivo datos del juego como puntuaciones, jugadores, partidas sin terminar, ajustes y estadísticas. Se utilizan para el funcionamiento de la aplicación y no se envían intencionadamente a servidores de DartScore Pro."],
["2. Publicidad","La versión gratuita puede mostrar anuncios mediante Google AdMob / Google Mobile Ads. Según tu ubicación, consentimiento y ajustes del dispositivo, Google y sus socios publicitarios pueden procesar dirección IP y ubicación aproximada, identificadores del dispositivo, datos publicitarios, interacciones con la app, datos de fallos y rendimiento. Estos datos pueden utilizarse para publicidad, analítica, funcionamiento de la app y, cuando esté permitido, seguimiento."],
["3. Consentimiento y seguimiento","Cuando sea necesario, las opciones de consentimiento publicitario se gestionan mediante Google User Messaging Platform y los controles de privacidad del dispositivo. En dispositivos Apple, el seguimiento está sujeto a App Tracking Transparency y al permiso del usuario cuando corresponda."],
["4. Compras dentro de la aplicación","Premium es una compra única procesada por Apple StoreKit en iPhone/iPad o Google Play Billing en Android. DartScore Pro no recibe los datos completos de tu tarjeta o cuenta bancaria. La app puede comprobar en el dispositivo el derecho a Premium; DartScore Pro no mantiene un servidor que almacene tu historial de compras."],
["5. Funciones de voz","Los avisos de voz utilizan los servicios de texto a voz del sistema operativo. DartScore Pro no graba intencionadamente tu voz ni utiliza la salida de voz para crear un perfil personal."],
["6. Conservación de datos","Los datos del juego guardados localmente permanecen en el dispositivo hasta que se sobrescriben, borran o eliminan con los datos de la app. Los terceros conservan los datos según sus propias políticas y obligaciones legales."],
["7. Tus opciones y derechos","Puedes gestionar las opciones de publicidad y privacidad mediante los controles de consentimiento de la app y los ajustes del dispositivo. Según tu jurisdicción, también puedes tener derechos de acceso, corrección, eliminación, limitación, oposición o retirada del consentimiento."],
["8. Servicios de terceros","DartScore Pro puede utilizar Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing y servicios del sistema operativo. Su tratamiento de datos se rige por sus propias políticas de privacidad."],
["9. Contacto","Para cuestiones de privacidad: randis@email.cz."]
]},
nl:{title:"Privacybeleid",date:"Ingangsdatum: 10 oktober 2026",sections:[
["1. Lokale appgegevens","DartScore Pro bewaart spelgegevens zoals scores, spelers, onafgemaakte spellen, instellingen en statistieken lokaal op je apparaat. Deze gegevens zijn nodig voor de werking van de app en worden niet bewust naar DartScore Pro-servers verzonden."],
["2. Advertenties","De gratis versie kan advertenties tonen via Google AdMob / Google Mobile Ads. Afhankelijk van locatie, toestemmingskeuzes en apparaatinstellingen kunnen Google en advertentiepartners onder andere IP-adres en globale locatie, apparaat-ID's, advertentiegegevens, app-interacties, crash- en prestatiegegevens verwerken. Deze gegevens kunnen worden gebruikt voor advertenties, analyse, app-functionaliteit en, waar toegestaan, tracking."],
["3. Toestemming en tracking","Waar vereist worden advertentietoestemmingen beheerd via Google User Messaging Platform en privacy-instellingen van het apparaat. Op Apple-apparaten valt tracking onder App Tracking Transparency en, waar van toepassing, toestemming van de gebruiker."],
["4. In-app aankopen","Premium is een eenmalige aankoop via Apple StoreKit op iPhone/iPad of Google Play Billing op Android. DartScore Pro ontvangt geen volledige betaalkaart- of bankgegevens. De app kan op het apparaat controleren of Premium is gekocht; DartScore Pro beheert geen server waarop je aankoopgeschiedenis wordt opgeslagen."],
["5. Spraakfuncties","Spraakmeldingen gebruiken de tekst-naar-spraakdiensten van het besturingssysteem. DartScore Pro neemt je stem niet bewust op en gebruikt spraakuitvoer niet om een persoonlijk profiel te maken."],
["6. Bewaartermijn","Lokaal opgeslagen spelgegevens blijven op je apparaat totdat ze worden overschreven, gewist of samen met de appgegevens worden verwijderd. Derden bewaren gegevens volgens hun eigen beleid en wettelijke verplichtingen."],
["7. Keuzes en rechten","Je kunt advertentie- en privacykeuzes beheren via de toestemmingsopties in de app en de instellingen van je apparaat. Afhankelijk van je rechtsgebied kun je ook rechten hebben op inzage, correctie, verwijdering, beperking, bezwaar of intrekking van toestemming."],
["8. Diensten van derden","DartScore Pro kan Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing en diensten van het besturingssysteem gebruiken. Hun gegevensverwerking valt onder hun eigen privacybeleid."],
["9. Contact","Voor privacyvragen: randis@email.cz."]
]},
ru:{title:"Политика конфиденциальности",date:"Дата вступления в силу: 10 октября 2026 г.",sections:[
["1. Локальные данные приложения","DartScore Pro хранит данные игры, включая очки, игроков, незавершённые игры, настройки и статистику, локально на вашем устройстве. Эти данные используются для работы приложения и намеренно не отправляются на серверы DartScore Pro."],
["2. Реклама","Бесплатная версия может показывать рекламу через Google AdMob / Google Mobile Ads. В зависимости от местоположения, выбора согласия и настроек устройства Google и его рекламные партнёры могут обрабатывать IP-адрес и примерное местоположение, идентификаторы устройства, рекламные данные, взаимодействия с приложением, данные о сбоях и производительности. Эти данные могут использоваться для рекламы, аналитики, работы приложения и, где разрешено, отслеживания."],
["3. Согласие и отслеживание","Где это требуется, выбор согласия на рекламу управляется через Google User Messaging Platform и настройки конфиденциальности устройства. На устройствах Apple отслеживание регулируется App Tracking Transparency и разрешением пользователя, когда оно требуется."],
["4. Покупки в приложении","Premium — разовая покупка через Apple StoreKit на iPhone/iPad или Google Play Billing на Android. DartScore Pro не получает полные данные банковской карты или счёта. Приложение может проверять право на Premium на устройстве; DartScore Pro не использует сервер для хранения истории ваших покупок."],
["5. Голосовые функции","Голосовые объявления используют системные службы преобразования текста в речь. DartScore Pro намеренно не записывает ваш голос и не использует голосовой вывод для создания персонального профиля."],
["6. Хранение данных","Локальные игровые данные остаются на устройстве до перезаписи, удаления или очистки данных приложения. Сторонние поставщики хранят данные согласно своим политикам и юридическим обязательствам."],
["7. Ваши права","Настройки рекламы и конфиденциальности можно управлять через элементы согласия в приложении и настройки устройства. В зависимости от юрисдикции у вас также могут быть права на доступ, исправление, удаление, ограничение, возражение или отзыв согласия."],
["8. Сторонние сервисы","DartScore Pro может использовать Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing и системные службы. Обработка данных этими сервисами регулируется их собственными политиками конфиденциальности."],
["9. Контакт","Вопросы о конфиденциальности: randis@email.cz."]
]},
zh:{title:"隐私政策",date:"生效日期：2026年10月10日",sections:[
["1. 本地应用数据","DartScore Pro 会将比分、玩家、未完成的比赛、设置和统计等游戏信息本地存储在你的设备上。这些信息用于提供应用功能，不会被有意发送到 DartScore Pro 服务器。"],
["2. 广告","免费版本可能通过 Google AdMob / Google Mobile Ads 显示广告。根据你所在的位置、同意选择和设备设置，Google 及其广告合作伙伴可能处理 IP 地址和大致位置、设备标识符、广告数据、应用交互、崩溃数据和性能数据。这些数据可能用于广告、分析、应用功能以及在法律允许的情况下用于跟踪。"],
["3. 同意与跟踪","在需要的地区，广告同意选择通过 Google User Messaging Platform 和设备隐私设置进行管理。在 Apple 设备上，跟踪受 App Tracking Transparency 规则以及适用情况下的用户许可约束。"],
["4. 应用内购买","Premium 是一次性购买，在 iPhone/iPad 上通过 Apple StoreKit 处理，在 Android 上通过 Google Play Billing 处理。DartScore Pro 不会获得完整的银行卡或银行账户信息。应用可在设备上检查 Premium 权限；DartScore Pro 不运营用于保存你的购买历史的服务器。"],
["5. 语音功能","语音提示使用操作系统的文字转语音服务。DartScore Pro 不会有意录制你的声音，也不会利用语音输出来建立个人资料。"],
["6. 数据保留","本地保存的游戏数据会保留在设备上，直到被覆盖、清除或随应用数据一起删除。第三方提供商会根据其自身政策和法律义务保留数据。"],
["7. 你的选择与权利","你可以通过应用内的同意选项和设备设置管理广告与隐私选择。根据你所在的司法辖区，你还可能享有访问、更正、删除、限制处理、反对处理或撤回同意等权利。"],
["8. 第三方服务","DartScore Pro 可能使用 Google AdMob / Google Mobile Ads、Apple StoreKit、Google Play Billing 和操作系统服务。这些服务的数据处理受其各自隐私政策约束。"],
["9. 联系方式","隐私问题请联系：randis@email.cz。"]
]}
};
function lang(v){v=(v||"en").toLowerCase();if(v.startsWith("cs"))return"cs";if(v.startsWith("de"))return"de";if(v.startsWith("es"))return"es";if(v.startsWith("nl"))return"nl";if(v.startsWith("ru"))return"ru";if(v.startsWith("zh"))return"zh";return"en"}
function render(l){const t=c[l]||c.en;document.documentElement.lang=l;document.querySelectorAll("button[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));let h='<h2>'+t.title+'</h2><p class="meta">'+t.date+'</p>';for(const s of t.sections)h+='<h2>'+s[0]+'</h2><p>'+s[1]+'</p>';document.getElementById("content").innerHTML=h;localStorage.setItem("dsp-privacy-lang",l)}
document.querySelectorAll("button[data-lang]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.lang)));
render(localStorage.getItem("dsp-privacy-lang")||lang(navigator.language));
</script></body></html>
