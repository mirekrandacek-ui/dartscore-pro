</style></head><body><main><div class="card"><h1>DartScore Pro</h1>
<div class="langs"><button data-lang="cs">CS</button><button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="es">ES</button><button data-lang="nl">NL</button><button data-lang="ru">RU</button><button data-lang="zh">ZH</button></div><div id="content"></div></div></main>
<script>
const T={
en:{title:"Privacy Policy",date:"Effective date: 10 October 2026",s:[
["Local app data","DartScore Pro stores game data such as scores, players, unfinished games, settings and statistics locally on your device. This data is used for app functionality and is not intentionally sent to DartScore Pro servers."],
["Advertising","The free version may display ads through Google AdMob / Google Mobile Ads. Depending on your location, consent choices and device settings, Google and its advertising partners may process IP address and approximate location, device identifiers, advertising data, app interactions, crash data and performance data. This information may be used for advertising, analytics, app functionality and, where permitted, tracking."],
["Consent and tracking","Where required, advertising consent choices are handled through Google User Messaging Platform and device privacy controls. On Apple devices, tracking is subject to Apple's App Tracking Transparency rules and user permission where applicable."],
["In-app purchases","Premium is a one-time purchase processed by Apple StoreKit on iPhone/iPad or Google Play Billing on Android. DartScore Pro does not receive full payment-card or bank details. The app may check purchase entitlement on the device to unlock Premium; DartScore Pro does not operate a server that stores your purchase history."],
["Voice features","Voice announcements use operating-system text-to-speech services. DartScore Pro does not intentionally record your voice or use voice output to create a personal profile."],
["Data retention and your choices","Local game data remains on your device until it is overwritten, cleared or removed with the app data. You can manage advertising and privacy choices through consent controls shown in the app and through your device settings. Third-party providers retain data according to their own policies and legal obligations."],
["Third-party services","DartScore Pro may use Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing and operating-system services. Their processing is governed by their own privacy policies."],
["Contact","For privacy questions, contact randis@email.cz."]
]},
cs:{title:"Zásady ochrany soukromí",date:"Platné od: 10. října 2026",s:[
["Lokální data aplikace","DartScore Pro ukládá skóre, hráče, rozehrané hry, nastavení a statistiky lokálně ve vašem zařízení. Data slouží k fungování aplikace a nejsou úmyslně odesílána na servery DartScore Pro."],
["Reklama","Bezplatná verze může zobrazovat reklamy přes Google AdMob / Google Mobile Ads. Podle polohy, voleb souhlasu a nastavení zařízení mohou Google a jeho reklamní partneři zpracovávat IP adresu a přibližnou polohu, identifikátory zařízení, reklamní údaje, interakce s aplikací, údaje o pádech a výkonu. Tyto údaje mohou být používány pro reklamu, analytiku, fungování aplikace a tam, kde je to povoleno, pro sledování."],
["Souhlas a sledování","Kde je to vyžadováno, volby souhlasu s reklamou jsou řešeny přes Google User Messaging Platform a nastavení soukromí zařízení. Na zařízeních Apple se sledování řídí pravidly App Tracking Transparency a souhlasem uživatele, pokud je vyžadován."],
["Nákupy v aplikaci","Premium je jednorázový nákup přes Apple StoreKit na iPhonu/iPadu nebo Google Play Billing na Androidu. DartScore Pro nezískává kompletní údaje o platební kartě ani bankovním účtu. Aplikace může na zařízení ověřit nárok na Premium; DartScore Pro neprovozuje server, který by ukládal historii vašich nákupů."],
["Hlasové funkce","Hlasová oznámení používají systémové služby převodu textu na řeč. DartScore Pro úmyslně nenahrává váš hlas ani nepoužívá hlasový výstup k vytváření osobního profilu."],
["Uchování dat a vaše volby","Lokální herní data zůstávají v zařízení, dokud nejsou přepsána, vymazána nebo odstraněna společně s daty aplikace. Nastavení reklamy a soukromí můžete spravovat přes volby souhlasu v aplikaci a nastavení zařízení. Třetí strany uchovávají data podle vlastních zásad a právních povinností."],
["Služby třetích stran","DartScore Pro může používat Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing a systémové služby zařízení. Zpracování dat těmito službami se řídí jejich vlastními zásadami ochrany soukromí."],
["Kontakt","Dotazy k ochraně soukromí posílejte na randis@email.cz."]
]},
de:{title:"Datenschutzerklärung",date:"Gültig ab: 10. Oktober 2026",s:[
["Lokale App-Daten","DartScore Pro speichert Punkte, Spieler, nicht beendete Spiele, Einstellungen und Statistiken lokal auf deinem Gerät. Diese Daten dienen der App-Funktion und werden nicht absichtlich an DartScore-Pro-Server gesendet."],
["Werbung","Die kostenlose Version kann Werbung über Google AdMob / Google Mobile Ads anzeigen. Abhängig von Standort, Einwilligung und Geräteeinstellungen können Google und Werbepartner IP-Adresse und ungefähren Standort, Gerätekennungen, Werbedaten, App-Interaktionen, Absturz- und Leistungsdaten verarbeiten. Diese Daten können für Werbung, Analyse, App-Funktionalität und, sofern zulässig, Tracking verwendet werden."],
["Einwilligung und Tracking","Wo erforderlich, werden Werbeeinwilligungen über die Google User Messaging Platform und Geräteeinstellungen verwaltet. Auf Apple-Geräten unterliegt Tracking den App-Tracking-Transparency-Regeln und gegebenenfalls der Zustimmung des Nutzers."],
["In-App-Käufe","Premium ist ein einmaliger Kauf über Apple StoreKit auf iPhone/iPad oder Google Play Billing auf Android. DartScore Pro erhält keine vollständigen Karten- oder Bankdaten. Die App kann die Kaufberechtigung auf dem Gerät prüfen; DartScore Pro betreibt keinen Server, der deine Kaufhistorie speichert."],
["Sprachfunktionen","Sprachausgaben verwenden die Text-to-Speech-Dienste des Betriebssystems. DartScore Pro zeichnet deine Stimme nicht absichtlich auf und erstellt daraus kein persönliches Profil."],
["Speicherung und Auswahlmöglichkeiten","Lokale Spieldaten bleiben auf deinem Gerät, bis sie überschrieben, gelöscht oder zusammen mit den App-Daten entfernt werden. Werbe- und Datenschutzeinstellungen kannst du über die Einwilligungsoptionen der App und die Geräteeinstellungen verwalten."],
["Drittanbieter","DartScore Pro kann Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing und Betriebssystemdienste verwenden. Für deren Datenverarbeitung gelten die jeweiligen Datenschutzrichtlinien."],
["Kontakt","Datenschutzfragen: randis@email.cz."]
]},
es:{title:"Política de privacidad",date:"Vigente desde: 10 de octubre de 2026",s:[
["Datos locales","DartScore Pro guarda puntuaciones, jugadores, partidas sin terminar, ajustes y estadísticas localmente en tu dispositivo. Estos datos sirven para el funcionamiento de la app y no se envían intencionadamente a servidores de DartScore Pro."],
["Publicidad","La versión gratuita puede mostrar anuncios mediante Google AdMob / Google Mobile Ads. Según tu ubicación, consentimiento y ajustes del dispositivo, Google y sus socios pueden procesar dirección IP y ubicación aproximada, identificadores del dispositivo, datos publicitarios, interacciones con la app, datos de fallos y rendimiento. Estos datos pueden usarse para publicidad, analítica, funcionamiento de la app y, cuando esté permitido, seguimiento."],
["Consentimiento y seguimiento","Cuando sea necesario, las opciones de consentimiento se gestionan mediante Google User Messaging Platform y los controles de privacidad del dispositivo. En dispositivos Apple, el seguimiento está sujeto a App Tracking Transparency y al permiso del usuario cuando corresponda."],
["Compras dentro de la app","Premium es una compra única procesada por Apple StoreKit en iPhone/iPad o Google Play Billing en Android. DartScore Pro no recibe los datos completos de tu tarjeta o cuenta bancaria. La app puede comprobar en el dispositivo el derecho a Premium; DartScore Pro no mantiene un servidor que almacene tu historial de compras."],
["Funciones de voz","Los avisos de voz usan servicios de texto a voz del sistema operativo. DartScore Pro no graba intencionadamente tu voz ni utiliza la salida de voz para crear un perfil personal."],
["Conservación y opciones","Los datos locales permanecen en el dispositivo hasta que se sobrescriben, borran o eliminan con los datos de la app. Puedes gestionar publicidad y privacidad mediante los controles de consentimiento de la app y los ajustes del dispositivo."],
["Servicios de terceros","DartScore Pro puede usar Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing y servicios del sistema operativo. Su tratamiento de datos se rige por sus propias políticas."],
["Contacto","Para cuestiones de privacidad: randis@email.cz."]
]},
nl:{title:"Privacybeleid",date:"Ingangsdatum: 10 oktober 2026",s:[
["Lokale appgegevens","DartScore Pro bewaart scores, spelers, onafgemaakte spellen, instellingen en statistieken lokaal op je apparaat. Deze gegevens zijn nodig voor de werking van de app en worden niet bewust naar DartScore Pro-servers verzonden."],
["Advertenties","De gratis versie kan advertenties tonen via Google AdMob / Google Mobile Ads. Afhankelijk van locatie, toestemming en apparaatinstellingen kunnen Google en advertentiepartners IP-adres en globale locatie, apparaat-ID's, advertentiegegevens, app-interacties, crash- en prestatiegegevens verwerken. Deze gegevens kunnen worden gebruikt voor advertenties, analyse, app-functionaliteit en, waar toegestaan, tracking."],
["Toestemming en tracking","Waar vereist worden advertentietoestemmingen beheerd via Google User Messaging Platform en privacy-instellingen van het apparaat. Op Apple-apparaten valt tracking onder App Tracking Transparency en, waar van toepassing, toestemming van de gebruiker."],
["In-app aankopen","Premium is een eenmalige aankoop via Apple StoreKit op iPhone/iPad of Google Play Billing op Android. DartScore Pro ontvangt geen volledige kaart- of bankgegevens. De app kan op het apparaat controleren of Premium is gekocht; DartScore Pro beheert geen server waarop je aankoopgeschiedenis wordt opgeslagen."],
["Spraakfuncties","Spraakmeldingen gebruiken tekst-naar-spraakdiensten van het besturingssysteem. DartScore Pro neemt je stem niet bewust op en gebruikt spraakuitvoer niet om een persoonlijk profiel te maken."],
["Bewaren en keuzes","Lokale spelgegevens blijven op het apparaat totdat ze worden overschreven, gewist of met de appgegevens worden verwijderd. Je kunt advertentie- en privacykeuzes beheren via de toestemmingsopties in de app en de apparaatinstellingen."],
["Diensten van derden","DartScore Pro kan Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing en systeemdiensten gebruiken. Hun gegevensverwerking valt onder hun eigen privacybeleid."],
["Contact","Voor privacyvragen: randis@email.cz."]
]},
ru:{title:"Политика конфиденциальности",date:"Действует с: 10 октября 2026 г.",s:[
["Локальные данные","DartScore Pro хранит очки, игроков, незавершённые игры, настройки и статистику локально на устройстве. Эти данные нужны для работы приложения и намеренно не отправляются на серверы DartScore Pro."],
["Реклама","Бесплатная версия может показывать рекламу через Google AdMob / Google Mobile Ads. В зависимости от местоположения, выбора согласия и настроек устройства Google и его партнёры могут обрабатывать IP-адрес и примерное местоположение, идентификаторы устройства, рекламные данные, взаимодействия с приложением, данные о сбоях и производительности. Эти данные могут использоваться для рекламы, аналитики, работы приложения и, где разрешено, отслеживания."],
["Согласие и отслеживание","Где это требуется, выбор согласия управляется через Google User Messaging Platform и настройки конфиденциальности устройства. На устройствах Apple отслеживание регулируется App Tracking Transparency и разрешением пользователя, когда оно требуется."],
["Покупки в приложении","Premium — разовая покупка через Apple StoreKit на iPhone/iPad или Google Play Billing на Android. DartScore Pro не получает полные данные карты или банковского счёта. Приложение может проверять право на Premium на устройстве; DartScore Pro не использует сервер для хранения истории покупок."],
["Голосовые функции","Голосовые объявления используют системные службы преобразования текста в речь. DartScore Pro намеренно не записывает голос и не создаёт из него персональный профиль."],
["Хранение и выбор","Локальные игровые данные остаются на устройстве до перезаписи, очистки или удаления вместе с данными приложения. Настройки рекламы и конфиденциальности можно управлять через элементы согласия в приложении и настройки устройства."],
["Сторонние сервисы","DartScore Pro может использовать Google AdMob / Google Mobile Ads, Apple StoreKit, Google Play Billing и системные службы. Обработка данных регулируется политиками соответствующих сервисов."],
["Контакт","Вопросы о конфиденциальности: randis@email.cz."]
]},
zh:{title:"隐私政策",date:"生效日期：2026年10月10日",s:[
["本地应用数据","DartScore Pro 会将比分、玩家、未完成比赛、设置和统计本地存储在你的设备上。这些数据用于应用功能，不会被有意发送到 DartScore Pro 服务器。"],
["广告","免费版本可能通过 Google AdMob / Google Mobile Ads 显示广告。根据你的位置、同意选择和设备设置，Google 及其广告合作伙伴可能处理 IP 地址和大致位置、设备标识符、广告数据、应用交互、崩溃数据和性能数据。这些数据可能用于广告、分析、应用功能以及在法律允许的情况下用于跟踪。"],
["同意与跟踪","在需要的地区，广告同意选择通过 Google User Messaging Platform 和设备隐私设置进行管理。在 Apple 设备上，跟踪受 App Tracking Transparency 规则以及适用情况下的用户许可约束。"],
["应用内购买","Premium 是一次性购买，在 iPhone/iPad 上通过 Apple StoreKit 处理，在 Android 上通过 Google Play Billing 处理。DartScore Pro 不会获得完整的银行卡或银行账户信息。应用可在设备上检查 Premium 权限；DartScore Pro 不运营用于保存购买历史的服务器。"],
["语音功能","语音提示使用操作系统的文字转语音服务。DartScore Pro 不会有意录制你的声音，也不会利用语音输出来建立个人资料。"],
["数据保留与选择","本地游戏数据会保留在设备上，直到被覆盖、清除或随应用数据一起删除。你可以通过应用内的同意选项和设备设置管理广告与隐私选择。"],
["第三方服务","DartScore Pro 可能使用 Google AdMob / Google Mobile Ads、Apple StoreKit、Google Play Billing 和系统服务。这些服务的数据处理受其各自隐私政策约束。"],
["联系方式","隐私问题请联系：randis@email.cz。"]
]}
};
function norm(v){v=(v||"en").toLowerCase();for(const k of ["cs","de","es","nl","ru","zh"])if(v.startsWith(k))return k;return"en"}
function render(l){const t=T[l]||T.en;document.documentElement.lang=l;document.querySelectorAll("button[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));let h='<h2>'+t.title+'</h2><p class="meta">'+t.date+'</p>';for(const s of t.s)h+='<h2>'+s[0]+'</h2><p>'+s[1]+'</p>';document.getElementById("content").innerHTML=h;localStorage.setItem("dsp-privacy-lang",l)}
document.querySelectorAll("button[data-lang]").forEach(b=>b.onclick=()=>render(b.dataset.lang));render(localStorage.getItem("dsp-privacy-lang")||norm(navigator.language));
</script></body></html>
